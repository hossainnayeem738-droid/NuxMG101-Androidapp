<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NUX MG-101 Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #ffffff; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .btn-primary {
      background: #e63946; color: #fff; border: none; border-radius: 10px;
      padding: 12px 24px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .btn-primary:active { opacity: 0.85; }
    .status-bar {
      width: 100%; max-width: 440px; background: #1e1e1e; border-radius: 10px;
      padding: 11px; text-align: center; color: #4ade80; font-size: 14px; font-weight: 500;
    }
    .card {
      width: 100%; max-width: 440px; background: #1e1e1e; border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .card-title { font-size: 16px; font-weight: 700; text-align: center; color: #f3f4f6; }
    
    /* Patch Controls */
    .patch-row { display: flex; align-items: center; justify-content: center; gap: 18px; }
    .patch-num { font-size: 20px; font-weight: 700; min-width: 85px; text-align: center; }

    /* Signal Chain Horizontal Strip */
    .chain-scroll {
      display: flex; align-items: center; gap: 6px; overflow-x: auto;
      padding: 6px 2px; scrollbar-width: none;
    }
    .chain-scroll::-webkit-scrollbar { display: none; }
    .chain-node {
      min-width: 58px; padding: 10px 6px; border-radius: 10px; background: #2a2a2a;
      border: 2px solid #3f3f46; text-align: center; cursor: pointer; flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .chain-node.active { background: #1f2937; border-color: #3b82f6; }
    .chain-node.selected { box-shadow: 0 0 0 2px #facc15; transform: translateY(-2px); }
    .node-code { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }
    .node-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #52525b;
      margin: 6px auto 0;
    }
    .chain-node.active .node-dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .arrow { color: #6b7280; font-size: 14px; font-weight: bold; }

    /* Block Editor Header */
    .block-header { display: flex; justify-content: space-between; align-items: center; }
    .toggle-btn {
      padding: 6px 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .toggle-on { background: #22c55e; color: #052e16; }
    .toggle-off { background: #3f3f46; color: #d4d4d8; }

    /* Sliders */
    .param-group { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .param-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #e5e7eb; }
    input[type="range"] { width: 100%; accent-color: #2563eb; height: 6px; cursor: pointer; }

    /* Order Buttons */
    .order-controls { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
    .btn-small {
      flex: 1; background: #2a2a2a; color: #e5e7eb; border: 1px solid #3f3f46;
      padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🎸 NUX MG-101 Controller</h1>
  <button class="btn-primary" id="connectBtn">Connect via OTG</button>

  <div class="status-bar" id="statusBar">Ready • Select a block in Signal Chain</div>

  <!-- Patch Select -->
  <div class="card">
    <div class="card-title">Patch Select</div>
    <div class="patch-row">
      <button class="btn-primary" id="prevPatch">◀ Prev</button>
      <div class="patch-num" id="patchDisplay">Patch 7</div>
      <button class="btn-primary" id="nextPatch">Next ▶</button>
    </div>
  </div>

  <!-- Signal Chain -->
  <div class="card">
    <div class="card-title">Signal Chain (Tap to Edit)</div>
    <div class="chain-scroll" id="chainContainer"></div>
    <div class="order-controls">
      <button class="btn-small" id="moveLeftBtn">◀ Move Block Left</button>
      <button class="btn-small" id="moveRightBtn">Move Block Right ▶</button>
    </div>
  </div>

  <!-- Active Block Parameters -->
  <div class="card" id="editorCard">
    <div class="block-header">
      <span class="card-title" id="blockTitle">AMP • Amplifier</span>
      <button class="toggle-btn toggle-on" id="blockToggleBtn">ON</button>
    </div>
    <div id="paramsContainer"></div>
  </div>

  <script>
    // NUX MG-101 Signal Chain Data Model
    let currentPatch = 7;
    let selectedIndex = 2; // Default selected: AMP
    let midiOutput = null;

    const signalChain = [
      { id: "NR",  name: "Noise Gate", enabled: true,  ccToggle: 20, params: [
        { label: "Threshold", value: 40, cc: 21 },
        { label: "Decay",     value: 30, cc: 22 }
      ]},
      { id: "EFX", name: "Overdrive",  enabled: true,  ccToggle: 23, params: [
        { label: "Drive",     value: 65, cc: 24 },
        { label: "Tone",      value: 55, cc: 25 },
        { label: "Level",     value: 70, cc: 26 }
      ]},
      { id: "AMP", name: "Amplifier",  enabled: true,  ccToggle: 27, params: [
        { label: "Amp Gain",  value: 86, cc: 28 },
        { label: "Master",    value: 75, cc: 29 },
        { label: "Bass",      value: 50, cc: 30 },
        { label: "Middle",    value: 60, cc: 31 },
        { label: "Treble",    value: 65, cc: 32 }
      ]},
      { id: "IR",  name: "Cabinet IR", enabled: true,  ccToggle: 33, params: [
        { label: "Cab Level", value: 80, cc: 34 }
      ]},
      { id: "EQ",  name: "6-Band EQ",  enabled: false, ccToggle: 35, params: [
        { label: "Low",       value: 50, cc: 36 },
        { label: "Mid",       value: 55, cc: 37 },
        { label: "High",      value: 52, cc: 38 }
      ]},
      { id: "MOD", name: "Modulation", enabled: false, ccToggle: 39, params: [
        { label: "Rate",      value: 45, cc: 40 },
        { label: "Depth",     value: 50, cc: 41 }
      ]},
      { id: "DLY", name: "Delay",      enabled: true,  ccToggle: 42, params: [
        { label: "Time",      value: 38, cc: 43 },
        { label: "Feedback",  value: 35, cc: 44 },
        { label: "Mix",       value: 30, cc: 45 }
      ]},
      { id: "RVB", name: "Reverb",     enabled: true,  ccToggle: 46, params: [
        { label: "Reverb Level", value: 32, cc: 47 },
        { label: "Decay",        value: 55, cc: 48 }
      ]}
    ];

    const statusBar = document.getElementById("statusBar");
    const chainContainer = document.getElementById("chainContainer");
    const paramsContainer = document.getElementById("paramsContainer");
    const blockTitle = document.getElementById("blockTitle");
    const blockToggleBtn = document.getElementById("blockToggleBtn");

    function setStatus(msg) {
      statusBar.textContent = msg;
    }

    // Send MIDI CC (0-100% mapped to 0-127)
    function sendCC(cc, percentVal) {
      const midiVal = Math.round((percentVal / 100) * 127);
      if (midiOutput) {
        midiOutput.send([0xB0, cc, midiVal]);
      }
    }

    function sendProgramChange(patchNum) {
      if (midiOutput) {
        midiOutput.send([0xC0, patchNum - 1]);
      }
    }

    function renderChain() {
      chainContainer.innerHTML = "";
      signalChain.forEach((block, idx) => {
        const node = document.createElement("div");
        node.className = `chain-node ${block.enabled ? "active" : ""} ${idx === selectedIndex ? "selected" : ""}`;
        node.innerHTML = `<div class="node-code">${block.id}</div><div class="node-dot"></div>`;
        node.onclick = () => {
          selectedIndex = idx;
          renderChain();
          renderEditor();
        };
        chainContainer.appendChild(node);

        if (idx < signalChain.length - 1) {
          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "→";
          chainContainer.appendChild(arrow);
        }
      });
    }

    function renderEditor() {
      const block = signalChain[selectedIndex];
      blockTitle.textContent = `${block.id} • ${block.name}`;
      blockToggleBtn.textContent = block.enabled ? "ON" : "OFF";
      blockToggleBtn.className = `toggle-btn ${block.enabled ? "toggle-on" : "toggle-off"}`;

      paramsContainer.innerHTML = "";
      block.params.forEach((p) => {
        const group = document.createElement("div");
        group.className = "param-group";
        group.innerHTML = `
          <div class="param-label">
            <span>${p.label}</span>
            <span>${p.value}%</span>
          </div>
          <input type="range" min="0" max="100" value="${p.value}" />
        `;
        const slider = group.querySelector("input");
        const valText = group.querySelector(".param-label span:last-child");
        slider.oninput = (e) => {
          p.value = Number(e.target.value);
          valText.textContent = `${p.value}%`;
          setStatus(`${p.label} set to ${p.value}%`);
          sendCC(p.cc, p.value);
        };
        paramsContainer.appendChild(group);
      });
    }

    // Toggle block ON/OFF
    blockToggleBtn.onclick = () => {
      const block = signalChain[selectedIndex];
      block.enabled = !block.enabled;
      sendCC(block.ccToggle, block.enabled ? 100 : 0);
      setStatus(`${block.name} turned ${block.enabled ? "ON" : "OFF"}`);
      renderChain();
      renderEditor();
    };

    // Reorder Signal Chain Blocks
    document.getElementById("moveLeftBtn").onclick = () => {
      if (selectedIndex > 0) {
        const temp = signalChain[selectedIndex];
        signalChain[selectedIndex] = signalChain[selectedIndex - 1];
        signalChain[selectedIndex - 1] = temp;
        selectedIndex--;
        setStatus(`Moved ${temp.id} left`);
        renderChain();
      }
    };

    document.getElementById("moveRightBtn").onclick = () => {
      if (selectedIndex < signalChain.length - 1) {
        const temp = signalChain[selectedIndex];
        signalChain[selectedIndex] = signalChain[selectedIndex + 1];
        signalChain[selectedIndex + 1] = temp;
        selectedIndex++;
        setStatus(`Moved ${temp.id} right`);
        renderChain();
      }
    };

    // Patch Select
    document.getElementById("prevPatch").onclick = () => {
      currentPatch = currentPatch > 1 ? currentPatch - 1 : 40;
      document.getElementById("patchDisplay").textContent = `Patch ${currentPatch}`;
      sendProgramChange(currentPatch);
      setStatus(`Loaded Patch ${currentPatch}`);
    };

    document.getElementById("nextPatch").onclick = () => {
      currentPatch = currentPatch < 40 ? currentPatch + 1 : 1;
      document.getElementById("patchDisplay").textContent = `Patch ${currentPatch}`;
      sendProgramChange(currentPatch);
      setStatus(`Loaded Patch ${currentPatch}`);
    };

    // Web MIDI OTG Connection
    document.getElementById("connectBtn").onclick = async () => {
      try {
        if (!navigator.requestMIDIAccess) {
          setStatus("Web MIDI not supported in this WebView");
          return;
        }
        const midi = await navigator.requestMIDIAccess({ sysex: true });
        const outputs = Array.from(midi.outputs.values());
        if (outputs.length > 0) {
          midiOutput = outputs[0];
          setStatus(`Connected: ${midiOutput.name}`);
        } else {
          setStatus("No OTG MIDI device found");
        }
      } catch (err) {
        setStatus(`OTG Error: ${err.message}`);
      }
    };

    renderChain();
    renderEditor();
  </script>
</body>
        </html>
