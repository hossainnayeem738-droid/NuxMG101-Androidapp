<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUX MG-101 Pro Studio</title>
  <style>
    body { font-family: sans-serif; background: #090d16; color: #f8fafc; margin: 0; padding: 14px; text-align: center; }
    .header { background: #1e293b; padding: 14px; border-radius: 12px; border-bottom: 3px solid #ef4444; margin-bottom: 12px; }
    .card { background: #1e293b; padding: 14px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
    .title { font-size: 12px; color: #94a3b8; letter-spacing: 1px; margin-bottom: 10px; font-weight: bold; }
    button { background: #ef4444; color: white; border: none; padding: 10px 16px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .patch-box { display: flex; justify-content: space-between; align-items: center; }
    .patch-display { font-size: 26px; font-weight: bold; color: #38bdf8; }
    .fx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .fx-btn { background: #334155; color: #cbd5e1; padding: 12px 6px; border-radius: 8px; font-size: 13px; border: 2px solid transparent; }
    .fx-btn.active { background: #065f46; color: #34d399; border-color: #10b981; }
    .slider-group { text-align: left; margin: 10px 0; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: #ef4444; margin-top: 4px; }
    .save-row { display: flex; gap: 8px; margin-top: 8px; }
    .save-btn { background: #0284c7; flex: 1; }
    .load-btn { background: #475569; flex: 1; }
    #status { font-size: 13px; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <h2 style="margin:0; font-size:20px;">🎸 NUX MG-101 Pro Studio</h2>
    <div id="status">Status: Not Connected (Plug OTG)</div>
    <button style="margin-top:10px; width:100%;" onclick="connectMIDI()">🔌 Connect NUX MG-101</button>
  </div>
  <div class="card">
    <div class="title">PRESET PATCH & MEMORY</div>
    <div class="patch-box">
      <button onclick="changePatch(-1)">◀ PREV</button>
      <div class="patch-display" id="patchDisplay">1A</div>
      <button onclick="changePatch(1)">NEXT ▶</button>
    </div>
    <div class="save-row">
      <button class="save-btn" onclick="saveLocalTone()">💾 Save Tone</button>
      <button class="load-btn" onclick="loadLocalTone()">📂 Load Tone</button>
    </div>
  </div>
  <div class="card">
    <div class="title">SIGNAL CHAIN (TAP TO ON/OFF)</div>
    <div class="fx-grid">
      <button class="fx-btn active" id="fx-cmp" onclick="toggleFX('fx-cmp', 20)">CMP</button>
      <button class="fx-btn active" id="fx-od" onclick="toggleFX('fx-od', 21)">OD / DIST</button>
      <button class="fx-btn active" id="fx-amp" onclick="toggleFX('fx-amp', 22)">AMP</button>
      <button class="fx-btn" id="fx-mod" onclick="toggleFX('fx-mod', 23)">MOD</button>
      <button class="fx-btn active" id="fx-dly" onclick="toggleFX('fx-dly', 24)">DELAY</button>
      <button class="fx-btn active" id="fx-rvb" onclick="toggleFX('fx-rvb', 25)">REVERB</button>
    </div>
  </div>
  <div class="card">
    <div class="title">AMP & 3-BAND EQ</div>
    <div class="slider-group"><label>Amp Gain: <span id="gainVal">50</span>%</label><input type="range" id="gainSlider" min="0" max="127" value="64" oninput="sendCC(1, this.value, 'gainVal')"></div>
    <div class="slider-group"><label>Bass: <span id="bassVal">50</span>%</label><input type="range" id="bassSlider" min="0" max="127" value="64" oninput="sendCC(14, this.value, 'bassVal')"></div>
    <div class="slider-group"><label>Middle: <span id="midVal">50</span>%</label><input type="range" id="midSlider" min="0" max="127" value="64" oninput="sendCC(15, this.value, 'midVal')"></div>
    <div class="slider-group"><label>Treble: <span id="trebVal">50</span>%</label><input type="range" id="trebSlider" min="0" max="127" value="64" oninput="sendCC(16, this.value, 'trebVal')"></div>
    <div class="slider-group"><label>Master Level: <span id="volVal">70</span>%</label><input type="range" id="volSlider" min="0" max="127" value="90" oninput="sendCC(7, this.value, 'volVal')"></div>
  </div>
  <div class="card">
    <div class="title">TIME & AMBIENCE</div>
    <div class="slider-group"><label>Delay Mix: <span id="dlyVal">30</span>%</label><input type="range" id="dlySlider" min="0" max="127" value="38" oninput="sendCC(12, this.value, 'dlyVal')"></div>
    <div class="slider-group"><label>Reverb Mix: <span id="revVal">35</span>%</label><input type="range" id="revSlider" min="0" max="127" value="45" oninput="sendCC(91, this.value, 'revVal')"></div>
  </div>
  <script>
    let midiOut = null; let patchIndex = 0; const letters = ['A', 'B', 'C', 'D'];
    async function connectMIDI() {
      const status = document.getElementById('status');
      if (!navigator.requestMIDIAccess) { status.innerText = "WebMIDI not supported on this WebView"; status.style.color = "#f87171"; return; }
      try {
        const access = await navigator.requestMIDIAccess({ sysex: true });
        for (let out of access.outputs.values()) { midiOut = out; status.innerText = "✅ Connected: " + out.name; status.style.color = "#4ade80"; return; }
        status.innerText = "⚠️ No MIDI Device Found. Check OTG Cable!"; status.style.color = "#fbbf24";
      } catch (e) { status.innerText = "Error: " + e.message; }
    }
    function changePatch(step) {
      patchIndex = (patchIndex + step + 36) % 36;
      document.getElementById('patchDisplay').innerText = (Math.floor(patchIndex / 4) + 1) + letters[patchIndex % 4];
      if (midiOut) midiOut.send([0xC0, patchIndex]);
    }
    function toggleFX(btnId, cc) {
      const btn = document.getElementById(btnId); btn.classList.toggle('active');
      if (midiOut) midiOut.send([0xB0, cc, btn.classList.contains('active') ? 127 : 0]);
    }
    function sendCC(cc, val, labelId) {
      document.getElementById(labelId).innerText = Math.round((val / 127) * 100);
      if (midiOut) midiOut.send([0xB0, cc, parseInt(val)]);
    }
    function saveLocalTone() {
      const d = { gain: gainSlider.value, bass: bassSlider.value, mid: midSlider.value, treb: trebSlider.value, vol: volSlider.value, dly: dlySlider.value, rev: revSlider.value };
      localStorage.setItem('nuxSavedTone_' + patchIndex, JSON.stringify(d));
      status.innerText = "💾 Tone Saved for Patch " + patchDisplay.innerText; status.style.color = "#38bdf8";
    }
    function loadLocalTone() {
      const saved = localStorage.getItem('nuxSavedTone_' + patchIndex);
      if (!saved) { status.innerText = "⚠️ No Saved Tone for this Patch"; return; }
      const d = JSON.parse(saved);
      gainSlider.value = d.gain; sendCC(1, d.gain, 'gainVal'); bassSlider.value = d.bass; sendCC(14, d.bass, 'bassVal');
      midSlider.value = d.mid; sendCC(15, d.mid, 'midVal'); trebSlider.value = d.treb; sendCC(16, d.treb, 'trebVal');
      volSlider.value = d.vol; sendCC(7, d.vol, 'volVal'); dlySlider.value = d.dly; sendCC(12, d.dly, 'dlyVal');
      revSlider.value = d.rev; sendCC(91, d.rev, 'revVal'); status.innerText = "📂 Loaded Saved Tone!";
    }
  </script>
</body>
        </html>
