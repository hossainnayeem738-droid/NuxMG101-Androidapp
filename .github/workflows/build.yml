name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Auto Create App & Build APK
        run: |
          rm -rf www android package.json package-lock.json capacitor.config.json capacitor.config.ts
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NUX MG-101 Studio</title>
            <style>
              body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; text-align: center; }
              .header { background: #1e293b; padding: 15px; border-radius: 12px; border-bottom: 3px solid #ef4444; margin-bottom: 15px; }
              .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
              button { background: #ef4444; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
              button:active { background: #dc2626; }
              .patch-box { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
              .patch-display { font-size: 28px; font-weight: bold; color: #38bdf8; }
              .slider-group { text-align: left; margin: 12px 0; }
              input[type=range] { width: 100%; accent-color: #ef4444; margin-top: 6px; }
              #status { font-size: 14px; color: #94a3b8; margin-top: 8px; }
            </style>
          </head>
          <body>
            <div class="header">
              <h2 style="margin:0;">🎸 NUX MG-101 Studio</h2>
              <div id="status">Status: Not Connected (Plug OTG)</div>
              <button style="margin-top:12px; width:100%;" onclick="connectMIDI()">🔌 Connect NUX MG-101</button>
            </div>

            <div class="card">
              <div style="font-size:14px; color:#94a3b8;">PRESET PATCH</div>
              <div class="patch-box">
                <button onclick="changePatch(-1)">◀ PREV</button>
                <div class="patch-display" id="patchDisplay">1A</div>
                <button onclick="changePatch(1)">NEXT ▶</button>
              </div>
            </div>

            <div class="card">
              <div style="font-size:14px; color:#94a3b8; margin-bottom:10px;">AMP & EFFECTS CONTROL</div>
              <div class="slider-group">
                <label>Amp Gain: <span id="gainVal">50</span>%</label>
                <input type="range" min="0" max="127" value="64" oninput="sendCC(1, this.value, 'gainVal')">
              </div>
              <div class="slider-group">
                <label>Master Level: <span id="volVal">70</span>%</label>
                <input type="range" min="0" max="127" value="90" oninput="sendCC(7, this.value, 'volVal')">
              </div>
              <div class="slider-group">
                <label>Delay Mix: <span id="dlyVal">30</span>%</label>
                <input type="range" min="0" max="127" value="38" oninput="sendCC(12, this.value, 'dlyVal')">
              </div>
              <div class="slider-group">
                <label>Reverb Mix: <span id="revVal">35</span>%</label>
                <input type="range" min="0" max="127" value="45" oninput="sendCC(91, this.value, 'revVal')">
              </div>
            </div>

            <script>
              let midiOut = null;
              let patchIndex = 0;
              const letters = ['A', 'B', 'C', 'D'];

              async function connectMIDI() {
                const status = document.getElementById('status');
                if (!navigator.requestMIDIAccess) {
                  status.innerText = "WebMIDI not supported on this WebView";
                  status.style.color = "#f87171";
                  return;
                }
                try {
                  const access = await navigator.requestMIDIAccess({ sysex: true });
                  for (let out of access.outputs.values()) {
                    midiOut = out;
                    status.innerText = "✅ Connected: " + out.name;
                    status.style.color = "#4ade80";
                    return;
                  }
                  status.innerText = "⚠️ No MIDI Device Found. Check OTG Cable!";
                  status.style.color = "#fbbf24";
                } catch (e) {
                  status.innerText = "Error: " + e.message;
                }
              }

              function changePatch(step) {
                patchIndex = (patchIndex + step + 36) % 36;
                const bank = Math.floor(patchIndex / 4) + 1;
                const slot = letters[patchIndex % 4];
                document.getElementById('patchDisplay').innerText = bank + slot;
                if (midiOut) midiOut.send([0xC0, patchIndex]);
              }

              function sendCC(cc, val, labelId) {
                document.getElementById(labelId).innerText = Math.round((val / 127) * 100);
                if (midiOut) midiOut.send([0xB0, cc, parseInt(val)]);
              }
            </script>
          </body>
          </html>
          EOF
          echo '{"name":"nux-mg101-editor","version":"1.0.0"}' > package.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "NUX MG101" "com.nux.mg101" --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NUX-MG101-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

