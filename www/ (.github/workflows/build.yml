name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web Folder
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<h2>NUX MG-101 Editor</h2>" > www/index.html
          fi
      - name: Install & Build Android
        run: |
          rm -f package.json package-lock.json capacitor.config.json
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "NUX MG101" "com.nux.mg101" --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NUX-MG101-App
          path: android/app/build/outputs/apk/debug/app-debug.apk


