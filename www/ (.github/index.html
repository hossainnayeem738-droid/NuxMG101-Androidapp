<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NUX MG-101 Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #ffffff; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .btn-primary {
      background: #e63946; color: #fff; border: none; border-radius: 10px;
      padding: 12px 24px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .btn-primary:active { opacity: 0.85; }
    .status-bar {
      width: 100%; max-width: 440px; background: #1e1e1e; border-radius: 10px;
      padding: 11px; text-align: center; color: #4ade80; font-size: 14px; font-weight: 500;
    }
    .card {
      width: 100%; max-width: 440px; background: #1e1e1e; border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .card-title { font-size: 16px; font-weight: 700; text-align: center; color: #f3f4f6; }
    
    /* Patch Controls */
    .patch-row { display: flex; align-items: center; justify-content: center; gap: 18px; }
    .patch-num { font-size: 20px; font-weight: 700; min-width: 85px; text-align: center; }

    /* Signal Chain Horizontal Strip */
    .chain-scroll {
      display: flex; align-items: center; gap: 6px; overflow-x: auto;
      padding: 6px 2px; scrollbar-width: none;
    }
    .chain-scroll::-webkit-scrollbar { display: none; }
    .chain-node {
      min-width: 58px; padding: 10px 6px; border-radius: 10px; background: #2a2a2a;
      border: 2px solid #3f3f46; text-align: center; cursor: pointer; flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .chain-node.active { background: #1f2937; border-color: #3b82f6; }
    .chain-node.selected { box-shadow: 0 0 0 2px #facc15; transform: translateY(-2px); }
    .node-code { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }
    .node-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #52525b;
      margin: 6px auto 0;
    }
    .chain-node.active .node-dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .arrow { color: #6b7280; font-size: 14px; font-weight: bold; }

    /* Block Editor Header */
    .block-header { display: flex; justify-content: space-between; align-items: center; }
    .toggle-btn {
      padding: 6px 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .toggle-on { background: #22c55e; color: #052e16; }
    .toggle-off { background: #3f3f46; color: #d4d4d8; }

    /* Sliders */
    .param-group { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .param-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #e5e7eb; }
    input[type="range"] { width: 100%; accent-color: #2563eb; height: 6px; cursor: pointer; }

    /* Order Buttons */
    .order-controls { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
    .btn-small {
      flex: 1; background: #2a2a2a; color: #e5e7eb; border: 1px solid #3f3f46;
      padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🎸 NUX MG-101 Controller</h1>
  <button class="btn-primary" id="connectBtn">Connect via OTG</button>

  <div class="status-bar" id="statusBar">Ready • Select a block in Signal Chain</div>

  <!-- Patch Select -->
  <div class="card">
    <div class="card-title">Patch Select</div>
    <div class="patch-row">
      <button class="btn-primary" id="prevPatch">◀ Prev</button>
      <div class="patch-num" id="patchDisplay">Patch 7</div>
      <button class="btn-primary" id="nextPatch">Next ▶</button>
    </div>
  </div>

  <!-- Signal Chain -->
  <div class="card">
    <div class="card-title">Signal Chain (Tap to Edit)</div>
    <div class="chain-scroll" id="chainContainer"></div>
    <div class="order-controls">
      <button class="btn-small" id="moveLeftBtn">◀ Move Block Left</button>
      <button class="btn-small" id="moveRightBtn">Move Block Right ▶</button>
    </div>
  </div>

  <!-- Active Block Parameters -->
  <div class="card" id="editorCard">
    <div class="block-header">
      <span class="card-title" id="blockTitle">AMP • Amplifier</span>
      <button class="toggle-btn toggle-on" id="blockToggleBtn">ON</button>
    </div>
    <div id="paramsContainer"></div>
  </div>

  <script>
    // NUX MG-101 Signal Chain Data Model
    let currentPatch = 7;
    let selectedIndex = 2; // Default selected: AMP
    let midiOutput = null;

    const signalChain = [
      { id: "NR",  name: "Noise Gate", enabled: true,  ccToggle: 20, params: [
        { label: "Threshold", value: 40, cc: 21 },
        { label: "Decay",     value: 30, cc: 22 }
      ]},
      { id: "EFX", name: "Overdrive",  enabled: true,  ccToggle: 23, params: [
        { label: "Drive",     value: 65, cc: 24 },
        { label: "Tone",      value: 55, cc: 25 },
        { label: "Level",     value: 70, cc: 26 }
      ]},
      { id: "AMP", name: "Amplifier",  enabled: true,  ccToggle: 27, params: [
        { label: "Amp Gain",  value: 86, cc: 28 },
        { label: "Master",    value: 75, cc: 29 },
        { label: "Bass",      value: 50, cc: 30 },
        { label: "Middle",    value: 60, cc: 31 },
        { label: "Treble",    value: 65, cc: 32 }
      ]},
      { id: "IR",  name: "Cabinet IR", enabled: true,  ccToggle: 33, params: [
        { label: "Cab Level", value: 80, cc: 34 }
      ]},
      { id: "EQ",  name: "6-Band EQ",  enabled: false, ccToggle: 35, params: [
        { label: "Low",       value: 50, cc: 36 },
        { label: "Mid",       value: 55, cc: 37 },
        { label: "High",      value: 52, cc: 38 }
      ]},
      { id: "MOD", name: "Modulation", enabled: false, ccToggle: 39, params: [
        { label: "Rate",      value: 45, cc: 40 },
        { label: "Depth",     value: 50, cc: 41 }
      ]},
      { id: "DLY", name: "Delay",      enabled: true,  ccToggle: 42, params: [
        { label: "Time",      value: 38, cc: 43 },
        { label: "Feedback",  value: 35, cc: 44 },
        { label: "Mix",       value: 30, cc: 45 }
      ]},
      { id: "RVB", name: "Reverb",     enabled: true,  ccToggle: 46, params: [
        { label: "Reverb Level", value: 32, cc: 47 },
        { label: "Decay",        value: 55, cc: 48 }
      ]}
    ];

    const statusBar = document.getElementById("statusBar");
    const chainContainer = document.getElementById("chainContainer");
    const paramsContainer = document.getElementById("paramsContainer");
    const blockTitle = document.getElementById("blockTitle");
    const blockToggleBtn = document.getElementById("blockToggleBtn");

    function setStatus(msg) {
      statusBar.textContent = msg;
    }

    // Send MIDI CC (0-100% mapped to 0-127)
    function sendCC(cc, percentVal) {
      const midiVal = Math.round((percentVal / 100) * 127);
      if (midiOutput) {
        midiOutput.send([0xB0, cc, midiVal]);
      }
    }

    function sendProgramChange(patchNum) {
      if (midiOutput) {
        midiOutput.send([0xC0, patchNum - 1]);
      }
    }

    function renderChain() {
      chainContainer.innerHTML = "";
      signalChain.forEach((block, idx) => {
        const node = document.createElement("div");
        node.className = `chain-node ${block.enabled ? "active" : ""} ${idx === selectedIndex ? "selected" : ""}`;
        node.innerHTML = `<div class="node-code">${block.id}</div><div class="node-dot"></div>`;
        node.onclick = () => {
          selectedIndex = idx;
          renderChain();
          renderEditor();
        };
        chainContainer.appendChild(node);

        if (idx < signalChain.length - 1) {
          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "→";
          chainContainer.appendChild(arrow);
        }
      });
    }

    function renderEditor() {
      const block = signalChain[selectedIndex];
      blockTitle.textContent = `${block.id} • ${block.name}`;
      blockToggleBtn.textContent = block.enabled ? "ON" : "OFF";
      blockToggleBtn.className = `toggle-btn ${block.enabled ? "toggle-on" : "toggle-off"}`;

      paramsContainer.innerHTML = "";
      block.params.forEach((p) => {
        const group = document.createElement("div");
        group.className = "param-group";
        group.innerHTML = `
          <div class="param-label">
            <span>${p.label}</span>
            <span>${p.value}%</span>
          </div>
          <input type="range" min="0" max="100" value="${p.value}" />
        `;
        const slider = group.querySelector("input");
        const valText = group.querySelector(".param-label span:last-child");
        slider.oninput = (e) => {
          p.value = Number(e.target.value);
          valText.textContent = `${p.value}%`;
          setStatus(`${p.label} set to ${p.value}%`);
          sendCC(p.cc, p.value);
        };
        paramsContainer.appendChild(group);
      });
    }

    // Toggle block ON/OFF
    blockToggleBtn.onclick = () => {
      const block = signalChain[selectedIndex];
      block.enabled = !block.enabled;
      sendCC(block.ccToggle, block.enabled ? 100 : 0);
      setStatus(`${block.name} turned ${block.enabled ? "ON" : "OFF"}`);
      renderChain();
      renderEditor();
    };

    // Reorder Signal Chain Blocks
    document.getElementById("moveLeftBtn").onclick = () => {
      if (selectedIndex > 0) {
        const temp = signalChain[selectedIndex];
        signalChain[selectedIndex] = signalChain[selectedIndex - 1];
        signalChain[selectedIndex - 1] = temp;
        selectedIndex--;
        setStatus(`Moved ${temp.id} left`);
        renderChain();
      }
    };

      width: 28px;

<body>
  <div class="top-bar">
    <div>
      <div class="brand-title">NUX MG-101</div>
      <div class="brand-sub">QUICKTONE DIGITAL STUDIO</div>
    </div>
    <button class="btn-otg" id="connectBtn">Connect via OTG</button>
  </div>

  <div class="status-bar" id="statusBar">
    <span>READY • AUTO-SAVE ON</span>
    <span>MIDI: OFF</span>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Patch Bank & Slot (1A–10D)</div>
      <button class="btn-reset" id="resetPatchBtn">Reset Patch</button>
    </div>
    <div class="patch-row">
      <button class="btn-nav" id="prevPatch">◀ Prev</button>
      <div class="patch-lcd" id="patchDisplay">1A</div>
      <button class="btn-nav" id="nextPatch">Next ▶</button>
    </div>
    <div>
      <div class="bank-grid" id="bankGrid"></div>
      <div class="slot-grid" id="slotGrid"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Signal Chain (Tap Block to Edit)</div>
    <div class="chain-grid" id="chainContainer"></div>
    <div class="order-controls">
      <button class="btn-small" id="moveLeftBtn">◀ Move Left</button>
      <button class="btn-small" id="moveRightBtn">Move Right ▶</button>
    </div>
  </div>

  <div class="card">
    <div class="block-header">
      <span class="card-title" id="blockTitle">AMP • Amplifier</span>
      <button class="toggle-btn toggle-on" id="blockToggleBtn">ACTIVE</button>
    </div>
    <div id="paramsContainer" style="display:flex; flex-direction:column; gap:9px;"></div>
  </div>

  <script>
    const KEY = "nux_qt_clean_v1";
    const LETTERS = ["A", "B", "C", "D"];
    const BLOCK_CC = { NR: 21, EFX: 22, AMP: 23, IR: 24, EQ: 25, MOD: 26, DLY: 27, RVB: 28 };
    let midiAccess = null, midiOut = null;

    function defaultPatch() {
      return {
        chain: ["NR", "EFX", "AMP", "IR", "EQ", "MOD", "DLY", "RVB"],
        blocks: {
          NR:  { name: "Noise Gate", on: true,  p: { Threshold: 35, Decay: 40 } },
          EFX: { name: "Overdrive",  on: true,  p: { Drive: 55, Tone: 60, Level: 70 } },
          AMP: { name: "Amplifier",  on: true,  p: { Gain: 75, Master: 70, Bass: 55, Middle: 50, Treble: 65 } },
          IR:  { name: "Cabinet IR", on: true,  p: { Level: 80, LowCut: 20, HighCut: 75 } },
          EQ:  { name: "6-Band EQ",  on: false, p: { "100Hz": 50, "220Hz": 50, "500Hz": 52, "1.2kHz": 55, "2.6kHz": 54, "6.4kHz": 50 } },
          MOD: { name: "Modulation", on: false, p: { Rate: 40, Depth: 50, Mix: 45 } },
          DLY: { name: "Delay",      on: true,  p: { Time: 45, Feedback: 35, Mix: 30 } },
          RVB: { name: "Reverb",     on: true,  p: { Decay: 50, Tone: 60, Mix: 35 } }
        }
      };
    }

    let state = { idx: 0, sel: "AMP", patches: {} };
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed.idx === "number" && parsed.patches) state = parsed;
      }
    } catch (e) {}

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    function curPatch() {
      if (!state.patches[state.idx] || !state.patches[state.idx].blocks) {
        state.patches[state.idx] = defaultPatch();
      }
      return state.patches[state.idx];
    }

    function patchName(i) {
      return (Math.floor(i / 4) + 1) + LETTERS[i % 4];
    }

    function setStatus(txt) {
      const m = midiOut ? "MIDI: " + midiOut.name : "MIDI: OFF";
      document.getElementById("statusBar").innerHTML = "<span>" + txt + "</span><span>" + m + "</span>";
    }

    function sendPC(i) {
      if (midiOut) midiOut.send([0xC0, Math.max(0, Math.min(127, i))]);
    }

    function sendCC(cc, v) {
      if (midiOut) midiOut.send([0xB0, cc, Math.max(0, Math.min(127, Math.round((v / 100) * 127)))]);
    }

    function selectPatch(newIdx) {
      state.idx = (newIdx + 40) % 40;
      save();
      sendPC(state.idx);
      renderAll();
      setStatus("PATCH " + patchName(state.idx) + " LOADED");
    }

    function setParam(code, k, v) {
      const n = parseInt(v, 10);
      const p = curPatch();
      const val = isNaN(n) ? p.blocks[code].p[k] : Math.max(0, Math.min(100, n));
      p.blocks[code].p[k] = val;
      save();
      sendCC(20, val);
      const sl = document.getElementById("sl_" + k);
      const inp = document.getElementById("in_" + k);
      if (sl) sl.value = val;
      if (inp) inp.value = val;
      setStatus(code + " " + k + ": " + val + "%");
    }

    function renderAll() {
      const p = curPatch();
      if (!p.blocks[state.sel]) state.sel = p.chain[0] || "AMP";
      document.getElementById("patchDisplay").textContent = patchName(state.idx);

      const bGrid = document.getElementById("bankGrid");
      const sGrid = document.getElementById("slotGrid");
      const activeB = Math.floor(state.idx / 4);
      const activeS = state.idx % 4;
      bGrid.innerHTML = "";
      for (let b = 0; b < 10; b++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "q-btn" + (b === activeB ? " active" : "");
        btn.textContent = "B" + (b + 1);
        btn.onclick = () => selectPatch(b * 4 + activeS);
        bGrid.appendChild(btn);
      }
      sGrid.innerHTML = "";
      LETTERS.forEach((lt, s) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "q-btn" + (s === activeS ? " active" : "");
        btn.textContent = (activeB + 1) + lt;
        btn.onclick = () => selectPatch(activeB * 4 + s);
        sGrid.appendChild(btn);
      });

      const chainEl = document.getElementById("chainContainer");
      chainEl.innerHTML = "";
      p.chain.forEach((code) => {
        const blk = p.blocks[code];
        const node = document.createElement("button");
        node.type = "button";
        node.className = "chain-node" + (blk.on ? " active" : "") + (state.sel === code ? " selected" : "");
        node.innerHTML = '<div class="node-code">' + code + '</div><div class="node-dot"></div>';
        node.onclick = () => {
          state.sel = code;
          save();
          renderAll();
          setStatus("SELECTED: " + code);
        };
        chainEl.appendChild(node);
      });

      const curBlk = p.blocks[state.sel];
      document.getElementById("blockTitle").textContent = state.sel + " • " + curBlk.name;
      const tBtn = document.getElementById("blockToggleBtn");
      tBtn.textContent = curBlk.on ? "ACTIVE" : "BYPASS";
      tBtn.className = "toggle-btn " + (curBlk.on ? "toggle-on" : "toggle-off");

      const paramsEl = document.getElementById("paramsContainer");
      paramsEl.innerHTML = "";
      Object.entries(curBlk.p).forEach(([k, val]) => {
        const grp = document.createElement("div");
        grp.className = "param-group";
        grp.innerHTML =
          '<div class="param-top">' +
            '<span class="param-label">' + k + '</span>' +
            '<div class="digital-stepper">' +
              '<button type="button" class="step-btn" id="m_' + k + '">−</button>' +
              '<input type="number" min="0" max="100" class="digital-input" id="in_' + k + '" value="' + val + '" />' +
              '<button type="button" class="step-btn" id="p_' + k + '">+</button>' +
            '</div>' +
          '</div>' +
          '<input type="range" min="0" max="100" id="sl_' + k + '" value="' + val + '" />';
        paramsEl.appendChild(grp);

        document.getElementById("m_" + k).onclick = () => setParam(state.sel, k, curBlk.p[k] - 1);
        document.getElementById("p_" + k).onclick = () => setParam(state.sel, k, curBlk.p[k] + 1);
        document.getElementById("in_" + k).onchange = (e) => setParam(state.sel, k, e.target.value);
        document.getElementById("sl_" + k).oninput = (e) => setParam(state.sel, k, e.target.value);
      });
    }

    document.getElementById("blockToggleBtn").onclick = () => {
      const b = curPatch().blocks[state.sel];
      if (!b) return;
      b.on = !b.on;
      sendCC(BLOCK_CC[state.sel] || 21, b.on ? 100 : 0);
      save();
      renderAll();
      setStatus(state.sel + (b.on ? " ACTIVE" : " BYPASS"));
    };

    document.getElementById("moveLeftBtn").onclick = () => {
      const c = curPatch().chain;
      const i = c.indexOf(state.sel);
      if (i > 0) {
        [c[i - 1], c[i]] = [c[i], c[i - 1]];
        sendCC(30, Math.round((i / Math.max(1, c.length - 1)) * 100));
        save();
        renderAll();
        setStatus("MOVED " + state.sel + " LEFT");
      }
    };

    document.getElementById("moveRightBtn").onclick = () => {
      const c = curPatch().chain;
      const i = c.indexOf(state.sel);
      if (i >= 0 && i < c.length - 1) {
        [c[i + 1], c[i]] = [c[i], c[i + 1]];
        sendCC(30, Math.round(((i + 1) / Math.max(1, c.length - 1)) * 100));
        save();
        renderAll();
        setStatus("MOVED " + state.sel + " RIGHT");
      }
    };

    document.getElementById("prevPatch").onclick = () => selectPatch(state.idx - 1);
    document.getElementById("nextPatch").onclick = () => selectPatch(state.idx + 1);
    document.getElementById("resetPatchBtn").onclick = () => {
      state.patches[state.idx] = defaultPatch();
      save();
      renderAll();
      setStatus("PATCH " + patchName(state.idx) + " RESET");
    };

    document.getElementById("connectBtn").onclick = async () => {
      if (!navigator.requestMIDIAccess) { setStatus("WEB-MIDI UNSUPPORTED"); return; }
      try {
        setStatus("REQUESTING USB MIDI...");
        midiAccess = await navigator.requestMIDIAccess({ sysex: true });
        const outs = Array.from(midiAccess.outputs.values());
        midiOut = outs.length > 0 ? outs[0] : null;
        setStatus(midiOut ? "OTG CONNECTED" : "NO USB MIDI FOUND");
      } catch (e) {
        setStatus("MIDI ERR: " + (e.message || "DENIED"));
      }
    };

    renderAll();
  </script>
</body>
</html>
