<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NUX MG-101 Digital Rig & Studio Gear</title>
  <style>
    :root{
      --bg:#080b0f;--card:#12161e;--card2:#19202b;--border:#2b3546;
      --text:#f1f5f9;--muted:#94a3b8;--blue:#1e88e5;--amber:#ffb300;--green:#4caf50;--red:#d32f2f;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;padding:12px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
    .app{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
    .card{background:linear-gradient(180deg,#161c26 0%,#0f131a 100%);border:1px solid var(--border);border-radius:14px;padding:12px;overflow-x:hidden;box-shadow:0 10px 26px rgba(0,0,0,0.45);}
    .row{display:flex;gap:8px;align-items:center;justify-content:space-between;}
    .grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px;}
    .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px;}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;}
    button,input{font-family:inherit;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 8px;font-weight:700;cursor:pointer;min-width:0;}
    input{flex:1;background:#0a0d12;border-color:var(--amber);font-weight:400;cursor:text;}
    .blue{background:linear-gradient(180deg,#2998ff 0%,#1565c0 100%);border-color:#2998ff;color:#fff;}
    .red{background:linear-gradient(180deg,#e53935 0%,#b71c1c 100%);border-color:#e53935;color:#fff;}
    .st{background:linear-gradient(90deg,#0c2238 0%,#102c47 100%);border:1px solid #1f4b75;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;}
    .sec-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px;}
    .grp-label{font-size:11px;font-weight:800;color:#82b8ff;margin:12px 0 6px 0;border-left:3px solid var(--blue);padding-left:7px;}
    .chain-blk{background:linear-gradient(180deg,#242c3b 0%,#121720 100%);border:1px solid #303c52;border-radius:11px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
    .chain-blk.on{border-color:#4caf50;box-shadow:inset 0 0 10px rgba(76,175,80,0.18);}
    .chain-blk.sel{outline:2px solid var(--amber);border-color:var(--amber);background:linear-gradient(180deg,#2e384b 0%,#171e2b 100%);}
    .led-strip{width:56%;height:3px;border-radius:999px;background:#3a4352;}
    .chain-blk.on .led-strip{background:#66bb6a;box-shadow:0 0 8px #4caf50;}
    .blk-screen{width:100%;background:#070a0e;border:1px solid rgba(255,255,255,0.09);border-radius:6px;padding:3px 2px;text-align:center;}
    .blk-code{display:block;font-size:10px;font-weight:900;color:#fff;}
    .blk-model{display:block;font-size:8px;color:#a5b6cc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
    .gear-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;}
    .gear-card{background:linear-gradient(180deg,#1c2330 0%,#11151d 100%);border:1px solid #2b3546;border-radius:11px;padding:5px 4px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;box-shadow:0 5px 14px rgba(0,0,0,0.45);}
    .gear-card.active{border-color:var(--amber);outline:2px solid var(--amber);background:linear-gradient(180deg,#273245 0%,#18202e 100%);box-shadow:0 0 16px rgba(255,179,0,0.35);}
    .gear-canvas{width:100%;height:68px;border-radius:7px;display:block;background:radial-gradient(circle at 50% 35%,#171d28 0%,#080b0f 100%);}
    .gear-name{font-size:10px;font-weight:800;line-height:1.15;color:#f1f5f9;word-break:break-word;margin-top:1px;}
    .mic-panel{background:linear-gradient(180deg,#1a212d 0%,#121720 100%);border:1px solid #2f3b4f;border-radius:12px;padding:10px;margin-top:10px;}
    .mic-card{background:linear-gradient(180deg,#171d27 0%,#10141c 100%);border:1px solid #2b3546;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;}
    .mic-card.active{border-color:var(--amber);outline:2px solid var(--amber);background:#242e3f;box-shadow:0 0 12px rgba(255,179,0,0.28);}
    .mic-canvas{width:48px;height:48px;display:block;}
    .pos-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;}
  </style>
</head>
<body>
<div class="app">
  <div class="card row">
    <div>
      <div style="font-size:15px;font-weight:900;letter-spacing:0.3px;">NUX MG-101 DIGITAL RIG STUDIO</div>
      <div style="font-size:11px;color:var(--muted);">Ultra-Digital Hardware &amp; Studio Gear Controller</div>
    </div>
    <button id="midiBtn" class="red">Connect OTG</button>
  </div>

  <div class="st">
    <span id="status">READY</span>
    <span id="midiState">MIDI: OFF</span>
  </div>

  <div class="card">
    <div class="row">
      <button id="prevP">◀ Prev</button>
      <div style="text-align:center;">
        <div id="pCode" style="font-size:18px;font-weight:900;color:#64b5f6;">2A</div>
        <div id="pName" style="font-size:11px;color:var(--muted);">Patch 2A</div>
      </div>
      <button id="nextP">Next ▶</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <input id="nameInp" maxlength="16" placeholder="Patch Name" />
      <button id="setName" class="blue">Set Name</button>
    </div>
    <div id="banks" class="grid5"></div>
    <div id="slots" class="grid4"></div>
  </div>

  <div class="card">
    <div class="sec-title">Signal Chain (10 Blocks)</div>
    <div id="chain" class="grid5"></div>
    <div class="grid2">
      <button id="mLeft">◀ Move Left</button>
      <button id="mRight">Move Right ▶</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span id="edTitle" class="sec-title" style="margin:0;">AMP</span>
      <button id="pwrBtn">ACTIVE</button>
    </div>
    <div id="visualGear" style="margin-top:8px;"></div>
    <div id="irExtras"></div>
    <div id="params" style="margin-top:10px;"></div>
  </div>
</div>

    {n:"CRUNCH",c:"#8e24aa",style:"mxr",tag:"CRNCH"},{n:"MUFF FUZZ",c:"#424242",style:"muff",tag:"MUFF"},{n:"KATANA",c:"#90a4ae",style:"mxr",tag:"KATNA"},

  ]}],
  AMP:[
    {g:"Combo Amps & Open-Back Cabinets",items:[
      {n:"TWEED 410",kind:"combo",skin:"tweed",spk:4},{n:"BRIT 212",kind:"combo",skin:"brit",spk:2},{n:"EVL 112",kind:"combo",skin:"dark",spk:1},
      {n:"CALI 112",kind:"combo",skin:"cream",spk:1},{n:"BLUE 112",kind:"combo",skin:"vox",spk:1},{n:"BLUE 212",kind:"combo",skin:"vox",spk:2},
      {n:"DC 212",kind:"combo",skin:"dark",spk:2},{n:"SUPER 212",kind:"combo",skin:"silver",spk:2},{n:"TWEED 112",kind:"combo",skin:"tweed",spk:1},
      {n:"TWIN 212",kind:"combo",skin:"silver",spk:2},{n:"BLACK 112",kind:"combo",skin:"blackface",spk:1},{n:"VIB 212",kind:"combo",skin:"brown",spk:2},

      {n:"BRIT 800",kind:"stack",skin:"jcm"},{n:"BRIT 2000",kind:"stack",skin:"jcm"},{n:"PLEXI 45",kind:"stack",skin:"plexi"},

      {n:"CUSTOM 412",kind:"cab",skin:"silver",badge:"CSTM"},{n:"V30 412",kind:"cab",skin:"black",badge:"V30"},{n:"BUTQ 212",kind:"cab",skin:"tan",badge:"212"},
      {n:"T75 412",kind:"cab",skin:"black",badge:"T75"},{n:"G12M 412",kind:"cab",skin:"black",badge:"G12M"},{n:"G12L 412",kind:"cab",skin:"black",badge:"G12L"},
      {n:"GREEN 412",kind:"cab",skin:"green",badge:"GRN"},{n:"SLO 412",kind:"cab",skin:"slo",badge:"SLO"},{n:"UBER 412",kind:"cab",skin:"uber",badge:"UBER"}
    ]},

      {n:"User IR 04",kind:"user",badge:"IR-04"},{n:"User IR 05",kind:"user",badge:"IR-05"},{n:"User IR 06",kind:"user",badge:"IR-06"},

  ]}],

  ]}],
  RVB:[{g:"Reverb (RVB)",items:[
    {n:"ROOM",c:"#37474f",style:"boss",tag:"ROOM"},{n:"HALL",c:"#8d6e63",style:"mxr",tag:"HALL"},{n:"PLATE",c:"#90a4ae",style:"mxr",tag:"PLAT"},

  ]}],
  "P.L":[{g:"Output Level",items:[{n:"PATCH LEVEL",c:"#1e88e5",style:"mxr",tag:"LEVEL"}]}]
  function shadeHex(hex,amt){
  var c=(hex||"#37474f").replace("#","");
  if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var n=parseInt(c,16);
  var r=Math.max(0,Math.min(255,((n>>16)&255)+amt));
  var g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  var b=Math.max(0,Math.min(255,(n&255)+amt));
  return "rgb("+r+","+g+","+b+")";
}

function drawSpeaker(ctx,x,y,r){
  var outer=ctx.createRadialGradient(x-r*0.25,y-r*0.25,r*0.1,x,y,r);
  outer.addColorStop(0,"#475569");outer.addColorStop(0.45,"#18202c");outer.addColorStop(0.82,"#05080d");outer.addColorStop(1,"#263042");
  ctx.fillStyle=outer;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.18)";ctx.lineWidth=1.1;ctx.stroke();

  var cone=ctx.createRadialGradient(x,y,r*0.32,x,y,r*0.85);
  cone.addColorStop(0,"#090c11");cone.addColorStop(0.7,"#161c26");cone.addColorStop(1,"#05070a");
  ctx.fillStyle=cone;ctx.beginPath();ctx.arc(x,y,r*0.82,0,Math.PI*2);ctx.fill();

  var cap=ctx.createRadialGradient(x-r*0.1,y-r*0.1,r*0.04,x,y,r*0.35);
  cap.addColorStop(0,"#64748b");cap.addColorStop(0.55,"#1e293b");cap.addColorStop(1,"#090d14");
  ctx.fillStyle=cap;ctx.beginPath();ctx.arc(x,y,r*0.34,0,Math.PI*2);ctx.fill();
}

function paintGearCanvas(cv,id,it){
  var w=cv.width=190, h=cv.height=136, ctx=cv.getContext("2d");
  ctx.clearRect(0,0,w,h);

  // Floor shadow
  ctx.fillStyle="rgba(0,0,0,0.55)";
  ctx.beginPath();ctx.ellipse(w/2,h-7,66,6,0,0,Math.PI*2);ctx.fill();

  if(id==="AMP"){
    if(it.kind==="stack"){
      var headCol="#181d26", faceCol="#94a3b8", grille="#0e1218";
      if(it.skin==="rect"){ faceCol="#cbd5e1"; grille="#1e2530"; }
      else if(it.skin==="jcm"||it.skin==="plexi"){ faceCol="#f59e0b"; }
      else if(it.skin==="slo"){ headCol="#e2e8f0"; faceCol="#1e293b"; }
      else if(it.skin==="vh4"){ faceCol="#f8fafc"; }

      ctx.fillStyle=headCol; ctx.fillRect(24,6,142,36);
      ctx.strokeStyle="#05070a"; ctx.lineWidth=2.5; ctx.strokeRect(24,6,142,36);
      ctx.fillStyle=faceCol; ctx.fillRect(30,20,130,17);

      if(it.skin==="rect"){
        ctx.fillStyle="#64748b";
        for(var rx=34;rx<154;rx+=9){ ctx.fillRect(rx,10,4.5,3.5); ctx.fillRect(rx+3.5,14.5,4.5,3.5); }
      }else{
        ctx.fillStyle=grille; ctx.fillRect(30,9,130,9);
      }

      for(var kx=42;kx<=140;kx+=14){
        ctx.fillStyle="#090d14"; ctx.beginPath(); ctx.arc(kx,28.5,4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="#e2e8f0"; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle="#fff"; ctx.fillRect(kx-0.7,25,1.4,3.5);
      }
      ctx.fillStyle="#ff1744"; ctx.beginPath(); ctx.arc(151,28.5,3.2,0,Math.PI*2); ctx.fill();

      ctx.fillStyle="#141923"; ctx.fillRect(18,45,154,82);
      ctx.strokeStyle="#e2e8f0"; ctx.lineWidth=1.5; ctx.strokeRect(22,49,146,74);
      ctx.fillStyle="#090c11"; ctx.fillRect(24,51,142,70);
      drawSpeaker(ctx,60,70,15.5); drawSpeaker(ctx,130,70,15.5);
      drawSpeaker(ctx,60,104,15.5); drawSpeaker(ctx,130,104,15.5);
      ctx.fillStyle="#1e293b"; ctx.fillRect(76,83,38,9);
      ctx.strokeStyle="#cbd5e1"; ctx.lineWidth=0.8; ctx.strokeRect(76,83,38,9);
    }else{
      var body="#1e2530", grill="#131821", panel="#cbd5e1", pipe="#94a3b8";
      if(it.skin==="tweed"){ body="#cfa257"; grill="#5a3e1e"; panel="#e2e8f0"; pipe="#785327"; }
      else if(it.skin==="vox"){ body="#2b1919"; grill="#7c4a2d"; panel="#7f1d1d"; pipe="#f59e0b"; }
      else if(it.skin==="cream"){ body="#e7d5b5"; grill="#a18256"; panel="#f8fafc"; pipe="#785327"; }
      else if(it.skin==="silver"){ body="#181c23"; grill="#64748b"; panel="#e2e8f0"; pipe="#f8fafc"; }
      else if(it.skin==="blackface"){ body="#111419"; grill="#334155"; panel="#0f172a"; pipe="#cbd5e1"; }
      else if(it.skin==="jazz"){ body="#181c23"; grill="#475569"; panel="#1e293b"; pipe="#94a3b8"; }

      ctx.fillStyle=body; ctx.fillRect(18,12,154,114);
      ctx.strokeStyle="#05070a"; ctx.lineWidth=2.5; ctx.strokeRect(18,12,154,114);
      ctx.fillStyle=panel; ctx.fillRect(24,18,142,21);
      for(var cx=38;cx<=138;cx+=14){
        ctx.fillStyle="#0f172a"; ctx.beginPath(); ctx.arc(cx,28.5,4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="#fff"; ctx.lineWidth=0.8; ctx.stroke();
      }
      ctx.fillStyle="#ff1744"; ctx.beginPath(); ctx.arc(154,28.5,3.2,0,Math.PI*2); ctx.fill();

      ctx.fillStyle=grill; ctx.fillRect(24,42,142,78);
      ctx.strokeStyle=pipe; ctx.lineWidth=1.5; ctx.strokeRect(24,42,142,78);
      if(it.spk===4){ drawSpeaker(ctx,62,62,15.5); drawSpeaker(ctx,128,62,15.5); drawSpeaker(ctx,62,98,15.5); drawSpeaker(ctx,128,98,15.5); }
      else if(it.spk===2){ drawSpeaker(ctx,60,81,22.5); drawSpeaker(ctx,130,81,22.5); }
      else{ drawSpeaker(ctx,95,81,27); }
    }
    return;
  }

  if(id==="IR"){
    if(it.kind==="user"){
      ctx.fillStyle="#101724"; ctx.fillRect(20,10,150,114);
      ctx.strokeStyle="#38bdf8"; ctx.lineWidth=2; ctx.strokeRect(20,10,150,114);
      var scr=ctx.createLinearGradient(0,22,0,70);
      scr.addColorStop(0,"#0c233d"); scr.addColorStop(1,"#050c17");
      ctx.fillStyle=scr; ctx.fillRect(30,22,130,48);
      ctx.strokeStyle="#38bdf8"; ctx.lineWidth=2.5; ctx.beginPath();
      ctx.moveTo(36,50); ctx.lineTo(56,33); ctx.lineTo(75,56); ctx.lineTo(96,29); ctx.lineTo(116,52); ctx.lineTo(136,37); ctx.lineTo(154,46); ctx.stroke();
      ctx.fillStyle="#7dd3fc"; ctx.font="bold 16px monospace"; ctx.textAlign="center"; ctx.fillText(it.badge,95,98);
      return;
    }
    var cabBody="#161b24", cabGrill="#0b0e14", cabPipe="#cbd5e1";
    if(it.skin==="tan"){ cabBody="#a17a48"; cabGrill="#4a351c"; cabPipe="#fef3c7"; }
    else if(it.skin==="green"){ cabBody="#1b2620"; cabGrill="#2f4538"; cabPipe="#eab308"; }
    else if(it.skin==="silver"){ cabBody="#1e242d"; cabGrill="#64748b"; cabPipe="#f8fafc"; }
    ctx.fillStyle=cabBody; ctx.fillRect(20,8,150,118);
    ctx.strokeStyle="#05070a"; ctx.lineWidth=2.5; ctx.strokeRect(20,8,150,118);
    ctx.fillStyle=cabGrill; ctx.fillRect(26,14,138,106);
    ctx.strokeStyle=cabPipe; ctx.lineWidth=1.8; ctx.strokeRect(26,14,138,106);
    drawSpeaker(ctx,60,44,20.5); drawSpeaker(ctx,130,44,20.5); drawSpeaker(ctx,60,90,20.5); drawSpeaker(ctx,130,90,20.5);
    ctx.fillStyle="#1e293b"; ctx.fillRect(70,60,50,15); ctx.strokeStyle="#cbd5e1"; ctx.lineWidth=1; ctx.strokeRect(70,60,50,15);
    ctx.fillStyle="#f8fafc"; ctx.font="bold 10.5px sans-serif"; ctx.textAlign="center"; ctx.fillText(it.badge||"4x12",95,71);
    return;
  }

  // Ultra-Digital 3D Stompbox Pedals
  var base=it.c||"#37474f";
  var px=46, py=6, pw=98, ph=122;
  var bodyGrad=ctx.createLinearGradient(px,py,px+pw,py+ph);
  bodyGrad.addColorStop(0,shadeHex(base,28));
  bodyGrad.addColorStop(0.5,base);
  bodyGrad.addColorStop(1,shadeHex(base,-38));

  ctx.fillStyle=bodyGrad;
  ctx.beginPath(); ctx.roundRect(px,py,pw,ph,13); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.28)"; ctx.lineWidth=1.8; ctx.stroke();

  // Left highlight rim
  ctx.strokeStyle="rgba(255,255,255,0.22)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(px+6,py+12); ctx.lineTo(px+6,py+ph-12); ctx.stroke();

  var knobCount=(it.style==="mxr")?2:3;
  for(var i=0;i<knobCount;i++){
    var kx=knobCount===2?(px+30+i*38):(px+21+i*28);
    ctx.fillStyle="rgba(0,0,0,0.45)"; ctx.beginPath(); ctx.arc(kx,28,10,0,Math.PI*2); ctx.fill();
    var kGrad=ctx.createRadialGradient(kx-2.5,25.5,1,kx,27,8.5);
    kGrad.addColorStop(0,"#ffffff"); kGrad.addColorStop(0.45,"#334155"); kGrad.addColorStop(1,"#090d12");
    ctx.fillStyle=kGrad; ctx.beginPath(); ctx.arc(kx,27,8.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#e2e8f0"; ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillStyle="#fff"; ctx.fillRect(kx-1.1,18.5,2.2,7.5);
  }

  // LED with glow
  var glow=ctx.createRadialGradient(95,46,1,95,46,10);
  glow.addColorStop(0,"#ff1744"); glow.addColorStop(0.5,"rgba(255,23,68,0.45)"); glow.addColorStop(1,"rgba(255,23,68,0)");
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(95,46,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#ff5252"; ctx.beginPath(); ctx.arc(95,46,3.5,0,Math.PI*2); ctx.fill();

  // Display plate
  ctx.fillStyle="#080b10"; ctx.fillRect(px+11,55,pw-22,22);
  ctx.strokeStyle="rgba(255,255,255,0.2)"; ctx.lineWidth=1; ctx.strokeRect(px+11,55,pw-22,22);
  ctx.fillStyle="#f8fafc"; ctx.font="bold 11px sans-serif"; ctx.textAlign="center"; ctx.fillText(it.tag||"FX",95,70);

  if(it.style==="boss"||it.style==="ts"){
    var padGrad=ctx.createLinearGradient(0,83,0,120);
    padGrad.addColorStop(0,"#1e293b"); padGrad.addColorStop(1,"#090d12");
    ctx.fillStyle=padGrad; ctx.beginPath(); ctx.roundRect(px+12,83,pw-24,37,7); ctx.fill();
    ctx.strokeStyle="#64748b"; ctx.lineWidth=1.4; ctx.stroke();
    ctx.fillStyle="#475569"; ctx.fillRect(px+22,115,pw-44,3);
  }else{
    var swGrad=ctx.createRadialGradient(92,100,2,95,102,11);
    swGrad.addColorStop(0,"#ffffff"); swGrad.addColorStop(0.55,"#cbd5e1"); swGrad.addColorStop(1,"#475569");
    ctx.fillStyle=swGrad; ctx.beginPath(); ctx.arc(95,102,10.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#1e293b"; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle="#64748b"; ctx.beginPath(); ctx.arc(95,102,4.2,0,Math.PI*2); ctx.fill();
  }
}

function paintMicCanvas(cv,micName){
  var w=cv.width=96, h=cv.height=96, ctx=cv.getContext("2d");
  ctx.clearRect(0,0,w,h);
  if(micName==="E906"){
    ctx.fillStyle="#1e293b"; ctx.beginPath(); ctx.roundRect(28,12,40,44,8); ctx.fill();
    ctx.strokeStyle="#cbd5e1"; ctx.lineWidth=2.2; ctx.stroke();
    ctx.strokeStyle="#f1f5f9"; ctx.lineWidth=2;
    for(var y=22;y<=46;y+=7.5){ ctx.beginPath(); ctx.moveTo(34,y); ctx.lineTo(62,y); ctx.stroke(); }
    ctx.fillStyle="#0f172a"; ctx.fillRect(40,56,16,30);
  }else if(micName==="SM57"){
    ctx.fillStyle="#cbd5e1"; ctx.beginPath(); ctx.roundRect(38,10,20,19,4); ctx.fill();
    ctx.fillStyle="#1e293b"; ctx.beginPath(); ctx.moveTo(36,29); ctx.lineTo(60,29); ctx.lineTo(54,86); ctx.lineTo(42,86); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#f59e0b"; ctx.fillRect(37,29,22,4);
  }else if(micName==="U87"){
    ctx.fillStyle="#f1f5f9"; ctx.beginPath(); ctx.roundRect(32,10,32,29,12); ctx.fill();
    ctx.strokeStyle="#64748b"; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle="#cbd5e1"; ctx.beginPath(); ctx.moveTo(32,39); ctx.lineTo(64,39); ctx.lineTo(57,86); ctx.lineTo(39,86); ctx.closePath(); ctx.fill();
  }else{
    ctx.fillStyle="#1e293b"; ctx.beginPath(); ctx.roundRect(30,10,36,40,6); ctx.fill();
    ctx.strokeStyle="#e2e8f0"; ctx.lineWidth=2.2; ctx.stroke();
    ctx.fillStyle="#f8fafc"; ctx.fillRect(36,16,24,19);
    ctx.fillStyle="#0f172a"; ctx.fillRect(42,50,12,36);
  }
}

var midiOut=null;
function flatModels(id){
  var out=[], groups=GEAR[id]||[];
  for(var i=0;i<groups.length;i++) for(var j=0;j<groups[i].items.length;j++) out.push(groups[i].items[j].n);
  return out.length?out:["Default"];
}
function newPatch(code){
  var b={};
  for(var i=0;i<ORDER.length;i++){
    var id=ORDER[i], pr={};
    for(var j=0;j<META[id].p.length;j++) pr[META[id].p[j][1]]=META[id].p[j][2];
    var list=flatModels(id);
    b[id]={on:(id!=="EQ"&&id!=="MOD"),model:list[0],p:pr};
    if(id==="IR"){ b[id].micOn=true; b[id].mic=IR_MICS[1]; b[id].pos=IR_POS[0]; b[id].micLvl=75; }
  }
  return {name:"Patch "+code,chain:ORDER.slice(),b:b};
}
function initState(){
  var patches={};
  for(var i=0;i<BANKS.length;i++) for(var j=0;j<SLOTS.length;j++){ var c=""+BANKS[i]+SLOTS[j]; patches[c]=newPatch(c); }
  return {bank:2,slot:"A",sel:"AMP",patches:patches};
}
var st=(function(){
  try{ var r=localStorage.getItem(KEY); if(r){ var o=JSON.parse(r); if(o&&o.patches&&o.patches["2A"]&&o.patches["2A"].b&&o.patches["2A"].b["P.L"]) return o; } }catch(e){}
  return initState();
})();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
function code(){ return ""+st.bank+st.slot; }
function patch(){
  var c=code();
  if(!st.patches[c]) st.patches[c]=newPatch(c);
  if(!META[st.sel]) st.sel="AMP";
  if(st.patches[c].b && st.patches[c].b.IR){
    if(typeof st.patches[c].b.IR.micOn!=="boolean") st.patches[c].b.IR.micOn=true;
    if(!st.patches[c].b.IR.mic) st.patches[c].b.IR.mic=IR_MICS[1];
    if(!st.patches[c].b.IR.pos) st.patches[c].b.IR.pos=IR_POS[0];
    if(typeof st.patches[c].b.IR.micLvl!=="number") st.patches[c].b.IR.micLvl=75;
  }
  return st.patches[c];
}
function sendCC(cc,v){ if(!midiOut) return; try{ midiOut.send([0xb0,cc,Math.max(0,Math.min(127,Math.round(v)))]); }catch(e){} }
function sendPC(pc){ if(!midiOut) return; try{ midiOut.send([0xc0,Math.max(0,Math.min(127,pc))]); }catch(e){} }
function sendName(n){
  if(!midiOut) return;
  try{
    var arr=[0xf0,0x43,0x01], s=String(n||"").slice(0,16);
    for(var i=0;i<s.length;i++) arr.push(s.charCodeAt(i)&0x7f);
    arr.push(0xf7); midiOut.send(arr);
  }catch(e){}
}
function sendChain(p){
  for(var i=0;i<p.chain.length;i++){ var m=META[p.chain[i]]; if(m) sendCC(m.cCc,i); }
}
function connectMidi(){
  var ms=document.getElementById("midiState");
  if(!navigator.requestMIDIAccess){ ms.textContent="MIDI: UNSUPPORTED"; return; }
  navigator.requestMIDIAccess({sysex:true}).then(function(acc){
    var outs=Array.from(acc.outputs.values());
    if(outs.length){
      midiOut=outs[0]; ms.textContent="MIDI: "+(midiOut.name||"OK");
      var b=document.getElementById("midiBtn"); b.textContent="OTG Connected"; b.className="blue";
      sendChain(patch());
    }else ms.textContent="MIDI: NO DEVICE";
  }).catch(function(){ ms.textContent="MIDI: BLOCKED"; });
      }
  function draw(syncInp){
  var p=patch(), c=code(), id=st.sel, m=META[id], blk=p.b[id];
  document.getElementById("pCode").textContent=c;
  document.getElementById("pName").textContent=p.name;
  var inp=document.getElementById("nameInp");
  if(syncInp||document.activeElement!==inp) inp.value=p.name;
  var micInfo=id==="IR"?(" ["+(blk.micOn?(blk.mic+" / "+blk.pos+" / Mic "+blk.micLvl):"MIC OFF")+"]"):"";
  document.getElementById("status").textContent="SELECTED: "+id+" ("+m.n+") - "+blk.model+micInfo;
  document.getElementById("edTitle").textContent=id+" - "+m.n.toUpperCase();

  var bg=document.getElementById("banks"); bg.innerHTML="";
  BANKS.forEach(function(b){
    var btn=document.createElement("button");
    btn.textContent="B"+b;
    if(st.bank===b) btn.className="blue";
    btn.onclick=function(){ st.bank=b; sendPC((st.bank-1)*4+SLOTS.indexOf(st.slot)); save(); draw(true); };
    bg.appendChild(btn);
  });

  var sg=document.getElementById("slots"); sg.innerHTML="";
  SLOTS.forEach(function(s){
    var btn=document.createElement("button");
    btn.textContent=""+st.bank+s;
    if(st.slot===s) btn.className="blue";
    btn.onclick=function(){ st.slot=s; sendPC((st.bank-1)*4+SLOTS.indexOf(st.slot)); save(); draw(true); };
    sg.appendChild(btn);
  });

  var cg=document.getElementById("chain"); cg.innerHTML="";
  p.chain.forEach(function(bid){
    var item=p.b[bid];
    if(!item||!META[bid]) return;
    var btn=document.createElement("button");
    btn.type="button";
    btn.className="chain-blk"+(item.on?" on":"")+(st.sel===bid?" sel":"");
    btn.innerHTML="<span class='led-strip'></span><span class='blk-screen'><span class='blk-code'>"+bid+"</span><span class='blk-model'>"+item.model+"</span></span>";
    btn.onclick=function(){
      if(st.sel===bid){ item.on=!item.on; sendCC(META[bid].cc,item.on?100:0); }
      else st.sel=bid;
      save(); draw(false);
    };
    cg.appendChild(btn);
  });

  var pb=document.getElementById("pwrBtn");
  pb.textContent=blk.on?"ACTIVE":"BYPASS";
  pb.className=blk.on?"blue":"";
  pb.onclick=function(){ blk.on=!blk.on; sendCC(m.cc,blk.on?100:0); save(); draw(false); };

  var vg=document.getElementById("visualGear"); vg.innerHTML="";
  var allNames=flatModels(id);
  (GEAR[id]||[]).forEach(function(grp){
    var lbl=document.createElement("div"); lbl.className="grp-label"; lbl.textContent=grp.g; vg.appendChild(lbl);
    var grid=document.createElement("div"); grid.className="gear-grid";
    grp.items.forEach(function(it){
      var card=document.createElement("button"); card.type="button";
      card.className="gear-card"+(blk.model===it.n?" active":"");
      var cv=document.createElement("canvas"); cv.className="gear-canvas";
      paintGearCanvas(cv,id,it);
      var nm=document.createElement("div"); nm.className="gear-name"; nm.textContent=it.n;
      card.appendChild(cv); card.appendChild(nm);
      card.onclick=function(){
        blk.model=it.n;
        var idx=allNames.indexOf(blk.model);
        var ccVal=allNames.length>1?Math.round((idx/(allNames.length-1))*127):0;
        sendCC(m.cc+40,ccVal); save(); draw(false);
      };
      grid.appendChild(card);
    });
    vg.appendChild(grid);
  });

  var irBox=document.getElementById("irExtras"); irBox.innerHTML="";
  if(id==="IR"){
    var micPanel=document.createElement("div"); micPanel.className="mic-panel";
    var headRow=document.createElement("div"); headRow.className="row";
    headRow.innerHTML="<span style='font-size:11px;font-weight:800;color:#82b8ff;'>CAB MIC CONTROL (4 MICS &amp; 3 POSITIONS)</span>";
    var micToggle=document.createElement("button"); micToggle.type="button";
    micToggle.textContent=blk.micOn?"MIC ON":"MIC OFF"; micToggle.className=blk.micOn?"blue":"";
    micToggle.onclick=function(){ blk.micOn=!blk.micOn; sendCC(55,blk.micOn?100:0); save(); draw(false); };
    headRow.appendChild(micToggle); micPanel.appendChild(headRow);

    var micGrid=document.createElement("div"); micGrid.className="grid4";
    IR_MICS.forEach(function(micName,idx){
      var b=document.createElement("button"); b.type="button";
      b.className="mic-card"+(blk.mic===micName?" active":"");
      var mcv=document.createElement("canvas"); mcv.className="mic-canvas";
      paintMicCanvas(mcv,micName);
      var mnm=document.createElement("div"); mnm.className="gear-name"; mnm.textContent=micName;
      b.appendChild(mcv); b.appendChild(mnm);
      b.onclick=function(){ blk.mic=micName; blk.micOn=true; sendCC(53,Math.round((idx/3)*127)); save(); draw(false); };
      micGrid.appendChild(b);
    });
    micPanel.appendChild(micGrid);

    var posLbl=document.createElement("div"); posLbl.className="grp-label"; posLbl.textContent="3 Mic Positions"; micPanel.appendChild(posLbl);
    var posGrid=document.createElement("div"); posGrid.className="grid3";
    IR_POS.forEach(function(posName,idx){
      var b=document.createElement("button"); b.type="button";
      var isSel=blk.pos===posName;
      b.className="pos-btn"+(isSel?" blue":"");
      b.innerHTML="<span class='gear-name'>"+posName+"</span>";
      b.onclick=function(){ blk.pos=posName; blk.micOn=true; sendCC(54,Math.round((idx/2)*127)); save(); draw(false); };
      posGrid.appendChild(b);
    });
    micPanel.appendChild(posGrid);

    var lvlBox=document.createElement("div"); lvlBox.style.marginTop="10px";
    lvlBox.innerHTML="<div class='row'><span style='font-size:12px;font-weight:700;'>Mic Level</span><div class='row' style='gap:4px;'><button type='button' class='mminus'>-</button><span class='mval' style='min-width:34px;text-align:center;'>"+blk.micLvl+"</span><button type='button' class='mplus'>+</button></div></div><input type='range' min='0' max='100' value='"+blk.micLvl+"' style='width:100%;margin-top:6px;accent-color:#2196f3;'>";
    var mvEl=lvlBox.querySelector(".mval"), mrEl=lvlBox.querySelector("input[type=range]");
    function setMicLvl(nv){
      nv=Math.max(0,Math.min(100,Number(nv)));
      blk.micLvl=nv; mvEl.textContent=nv; mrEl.value=nv; sendCC(56,nv); save();
    }
    mrEl.oninput=function(){ setMicLvl(mrEl.value); };
    lvlBox.querySelector(".mminus").onclick=function(){ setMicLvl(blk.micLvl-1); };
    lvlBox.querySelector(".mplus").onclick=function(){ setMicLvl(blk.micLvl+1); };
    micPanel.appendChild(lvlBox);
    irBox.appendChild(micPanel);
  }

  var pw=document.getElementById("params"); pw.innerHTML="";
  m.p.forEach(function(pr){
    var cc=pr[1], val=(typeof blk.p[cc]==="number")?blk.p[cc]:pr[2]; blk.p[cc]=val;
    var box=document.createElement("div"); box.className="card"; box.style.padding="8px 10px"; box.style.marginTop="6px";
    box.innerHTML="<div class='row'><span style='font-size:13px;font-weight:700;'>"+pr[0]+"</span><div class='row' style='gap:4px;'><button type='button' class='minus'>-</button><span class='val' style='min-width:34px;text-align:center;'>"+val+"</span><button type='button' class='plus'>+</button></div></div><input type='range' min='0' max='100' value='"+val+"' style='width:100%;margin-top:6px;accent-color:#2196f3;'>";
    var vEl=box.querySelector(".val"), rEl=box.querySelector("input[type=range]");
    function setV(nv){
      nv=Math.max(0,Math.min(100,Number(nv)));
      blk.p[cc]=nv; vEl.textContent=nv; rEl.value=nv; sendCC(cc,nv); save();
    }
    rEl.oninput=function(){ setV(rEl.value); };
    box.querySelector(".minus").onclick=function(){ setV(blk.p[cc]-1); };
    box.querySelector(".plus").onclick=function(){ setV(blk.p[cc]+1); };
    pw.appendChild(box);
  });
}

function stepPatch(d){
  var list=[]; BANKS.forEach(function(b){ SLOTS.forEach(function(s){ list.push(""+b+s); }); });
  var i=list.indexOf(code()), nxt=list[(i+d+list.length)%list.length];
  st.bank=parseInt(nxt,10); st.slot=nxt.slice(-1);
  sendPC((st.bank-1)*4+SLOTS.indexOf(st.slot)); save(); draw(true);
}
function moveBlock(d){
  var p=patch(), i=p.chain.indexOf(st.sel), t=i+d;
  if(i<0||t<0||t>=p.chain.length) return;
  var tmp=p.chain[i]; p.chain[i]=p.chain[t]; p.chain[t]=tmp;
  sendChain(p); save(); draw(false);
}

document.getElementById("midiBtn").onclick=connectMidi;
document.getElementById("prevP").onclick=function(){ stepPatch(-1); };
document.getElementById("nextP").onclick=function(){ stepPatch(1); };
document.getElementById("setName").onclick=function(){
  var v=document.getElementById("nameInp").value.trim(); if(!v) return;
  var clean=v.slice(0,16); patch().name=clean; sendName(clean); save(); draw(true);
};
document.getElementById("mLeft").onclick=function(){ moveBlock(-1); };
document.getElementById("mRight").onclick=function(){ moveBlock(1); };
draw(true);
</script>

};
