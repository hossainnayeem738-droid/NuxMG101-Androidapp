<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NUX MG-101 QuickTone Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #171d2b 0%, #0b0d12 65%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      gap: 12px;
      min-height: 100vh;
    }

    .top-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #121722;
      border: 1px solid #242d3d;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .brand-box { display: flex; flex-direction: column; gap: 2px; }
    .brand-title { font-size: 17px; font-weight: 800; letter-spacing: 0.4px; color: #f8fafc; }
    .brand-sub { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #38bdf8; text-transform: uppercase; }

    .btn-otg {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #ffffff;
      border: 1px solid #f87171;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.28);
    }
    .btn-otg:active { transform: scale(0.98); }

    .status-bar {
      width: 100%;
      max-width: 450px;
      background: #0d1118;
      border: 1px solid #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 10px;
      padding: 9px 12px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: 700;
      color: #7dd3fc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: #121722;
      border: 1px solid #222b3a;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .card-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #cbd5e1;
    }

    .btn-reset {
      background: #1b2232;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-reset:active { background: #334155; color: #f8fafc; }

    /* Patch LCD Row */
    .patch-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .btn-nav {
      background: #1a2232;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-nav:active { background: #2563eb; border-color: #60a5fa; }

    .patch-lcd {
      flex: 1;
      background: #06080c;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 8px 14px;
      text-align: center;
      font-family: "Courier New", monospace;
      font-size: 26px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
    }

    /* Quick Bank (1-10) & Slot (A-D) Grid */
    .quick-patch-box { display: flex; flex-direction: column; gap: 7px; }
    .bank-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .q-btn {
      background: #171e2c;
      color: #cbd5e1;
      border: 1px solid #2b364b;
      border-radius: 8px;
      padding: 7px 4px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .q-btn.active {
      background: linear-gradient(180deg, #0284c7, #0369a1);
      color: #ffffff;
      border-color: #7dd3fc;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.28);
    }
    .q-btn:active { transform: scale(0.97); }

    /* Signal Chain Strip */
    .chain-scroll {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding: 6px 2px;
      scrollbar-width: none;
    }
    .chain-scroll::-webkit-scrollbar { display: none; }
    .chain-node {
      min-width: 54px;
      padding: 9px 5px;
      border-radius: 10px;
      background: #171e2c;
      border: 1.5px solid #2b364b;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.14s ease;
    }
    .chain-node.active {
      background: #122436;
      border-color: #22c55e;
      box-shadow: inset 0 0 8px rgba(34, 197, 94, 0.15);
    }
    .chain-node.selected {
      border-color: #facc15;
      box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.45);
    }
    .node-code { font-size: 12px; font-weight: 900; letter-spacing: 0.4px; color: #f8fafc; }
    .node-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin: 6px auto 0;
      background: #475569;
    }
    .chain-node.active .node-dot {
      background: #22c55e;
      box-shadow: 0 0 7px #22c55e;
    }
    .chain-arrow { color: #64748b; font-size: 12px; font-weight: 800; }

    .order-controls { display: flex; gap: 8px; }
    .btn-small {
      flex: 1;
      background: #171e2c;
      color: #e2e8f0;
      border: 1px solid #2b364b;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-small:active { background: #263248; }

    /* Block Editor */
    .block-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .toggle-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .toggle-on {
      background: #22c55e;
      color: #052e16;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
    }
    .toggle-off {
      background: #273042;
      color: #94a3b8;
      border: 1px solid #3b4861;
    }

    .param-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0d1118;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #1e2736;
    }
    .param-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .param-label { font-size: 13px; font-weight: 700; color: #e2e8f0; }

    .digital-stepper { display: flex; align-items: center; gap: 5px; }
    .step-btn {
      width: 28px;
      height: 28px;
      background: #1b2333;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .step-btn:active { background: #0284c7; border-color: #38bdf8; }

    .digital-input {
      width: 56px;
      height: 28px;
      background: #06080c;
      border: 1px solid #25446b;
      border-radius: 7px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      font-weight: 800;
      color: #38bdf8;
      text-align: center;
      outline: none;
    }
    .digital-input:focus {
      border-color: #facc15;
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.25);
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      height: 6px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-box">
      <div class="brand-title">NUX MG-101</div>
      <div class="brand-sub">QuickTone Digital Studio</div>
    </div>
    <button class="btn-otg" id="connectBtn">Connect via OTG</button>
  </div>

  <div class="status-bar" id="statusBar">
    <span>READY • AUTO-SAVE ON</span>
    <span id="midiTag">MIDI: OFF</span>
  </div>

  <!-- Patch Select + Quick 1A-10D -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Patch Bank & Slot (1A–10D)</div>
      <button class="btn-reset" id="resetPatchBtn">Reset Patch</button>
    </div>
    <div class="patch-row">
      <button class="btn-nav" id="prevPatch">◀ Prev</button>
      <div class="patch-lcd" id="patchDisplay">1A</div>
      <button class="btn-nav" id="nextPatch">Next ▶</button>
    </div>
    <div class="quick-patch-box">
      <div class="bank-grid" id="bankGrid"></div>
      <div class="slot-grid" id="slotGrid"></div>
    </div>
  </div>

  <!-- Signal Chain -->
  <div class="card">
    <div class="card-title">Signal Chain (Tap Block to Edit)</div>
    <div class="chain-scroll" id="chainContainer"></div>
    <div class="order-controls">
      <button class="btn-small" id="moveLeftBtn">◀ Move Left</button>
      <button class="btn-small" id="moveRightBtn">Move Right ▶</button>
    </div>
  </div>

  <!-- Active Block Parameters -->
  <div class="card" id="editorCard">
    <div class="block-header">
      <span class="card-title" id="blockTitle">AMP • Amplifier</span>
      <button class="toggle-btn toggle-on" id="blockToggleBtn">ON</button>
    </div>
    <div id="paramsContainer" style="display:flex; flex-direction:column; gap:9px;"></div>
  </div>

  <script>
    const STORAGE_KEY = "nux_mg101_quicktone_v1";
    const BANK_LETTERS = ["A", "B", "C", "D"];
    const TOTAL_PATCHES = 40;

    let midiAccess = null;
    let activeMidiOutput = null;
    const MIDI_CHANNEL = 0;

    function createDefaultPatchData() {
      return {
        chain: ["NR", "EFX", "AMP", "IR", "EQ", "MOD", "DLY", "RVB"],
        blocks: {
          NR:  { name: "Noise Gate", enabled: true,  params: { Threshold: 35, Decay: 40 } },
          EFX: { name: "Overdrive / Comp", enabled: true,  params: { Drive: 55, Tone: 60, Level: 70 } },
          AMP: { name: "Amplifier",  enabled: true,  params: { Gain: 75, Master: 70, Bass: 55, Middle: 50, Treble: 65 } },
          IR:  { name: "Cabinet IR", enabled: true,  params: { Level: 80, LowCut: 20, HighCut: 75 } },
          EQ:  { name: "6-Band EQ",  enabled: false, params: { "100Hz": 50, "220Hz": 50, "500Hz": 52, "1.2kHz": 55, "2.6kHz": 54, "6.4kHz": 50 } },
          MOD: { name: "Modulation", enabled: false, params: { Rate: 40, Depth: 50, Mix: 45 } },
          DLY: { name: "Delay",      enabled: true,  params: { Time: 45, Feedback: 35, Mix: 30 } },
          RVB: { name: "Reverb",     enabled: true,  params: { Decay: 50, Tone: 60, Mix: 35 } }
        }
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return { currentPatchIndex: 0, selectedBlock: "AMP", patches: {} };
    }

    let appState = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {}
    }

    function getCurrentPatch() {
      const idx = appState.currentPatchIndex;
      if (!appState.patches[idx]) {
        appState.patches[idx] = createDefaultPatchData();
      }
      return appState.patches[idx];
    }

    function formatPatchName(index) {
      const bank = Math.floor(index / 4) + 1;
      const letter = BANK_LETTERS[index % 4];
      return `${bank}${letter}`;
    }

    const statusBar = document.getElementById("statusBar");
    const patchDisplay = document.getElementById("patchDisplay");
    const bankGrid = document.getElementById("bankGrid");
    const slotGrid = document.getElementById("slotGrid");
    const chainContainer = document.getElementById("chainContainer");
    const blockTitle = document.getElementById("blockTitle");
    const blockToggleBtn = document.getElementById("blockToggleBtn");
    const paramsContainer = document.getElementById("paramsContainer");

    function getMidiBadgeText() {
      return activeMidiOutput ? `MIDI: ${activeMidiOutput.name}` : "MIDI: READY";
    }

    function updateStatus(msg) {
      statusBar.innerHTML = `<span>${msg}</span><span>${getMidiBadgeText()}</span>`;
    }

    function sendProgramChange(patchIndex) {
      if (!activeMidiOutput) return;
      const program = Math.max(0, Math.min(127, patchIndex));
      activeMidiOutput.send([0xC0 | MIDI_CHANNEL, program]);
    }

    function sendControlChange(ccNumber, value0to100) {
      if (!activeMidiOutput) return;
      const ccVal = Math.max(0, Math.min(127, Math.round((value0to100 / 100) * 127)));
      activeMidiOutput.send([0xB0 | MIDI_CHANNEL, ccNumber, ccVal]);
    }

    function refreshMidiPorts() {
      if (!midiAccess) return;
      const outputs = Array.from(midiAccess.outputs.values());
      if (outputs.length > 0) {
        activeMidiOutput = outputs[0];
        updateStatus(`OTG LINKED • ${formatPatchName(appState.currentPatchIndex)}`);
      } else {
        activeMidiOutput = null;
        updateStatus("NO USB MIDI • CHECK OTG");
      }
    }

    function selectPatchIndex(newIndex) {
      appState.currentPatchIndex = (newIndex + TOTAL_PATCHES) % TOTAL_PATCHES;
      saveState();
      sendProgramChange(appState.currentPatchIndex);
      renderPatchHeader();
      renderPatchGrid();
      renderChain();
      renderEditor();
      updateStatus(`PATCH ${formatPatchName(appState.currentPatchIndex)} LOADED`);
    }

    function renderPatchHeader() {
      patchDisplay.textContent = formatPatchName(appState.currentPatchIndex);
    }

    function renderPatchGrid() {
      const activeBank = Math.floor(appState.currentPatchIndex / 4);
      const activeSlot = appState.currentPatchIndex % 4;

      bankGrid.innerHTML = "";
      for (let b = 0; b < 10; b++) {
        const btn = document.createElement("button");
        btn.className = "q-btn" + (b === activeBank ? " active" : "");
        btn.textContent = `B${b + 1}`;
        btn.onclick = () => selectPatchIndex(b * 4 + activeSlot);
        bankGrid.appendChild(btn);
      }

      slotGrid.innerHTML = "";
      BANK_LETTERS.forEach((letter, s) => {
        const btn = document.createElement("button");
        btn.className = "q-btn" + (s === activeSlot ? " active" : "");
        btn.textContent = `${activeBank + 1}${letter}`;
        btn.onclick = () => selectPatchIndex(activeBank * 4 + s);
        slotGrid.appendChild(btn);
      });
    }

    function renderChain() {
      const patch = getCurrentPatch();
      chainContainer.innerHTML = "";
      patch.chain.forEach((code, index) => {
        const block = patch.blocks[code];
        const node = document.createElement("div");
        node.className = "chain-node" + (block.enabled ? " active" : "") + (appState.selectedBlock === code ? " selected" : "");
        node.innerHTML = `<div class="node-code">${code}</div><div class="node-dot"></div>`;
        node.onclick = () => {
          appState.selectedBlock = code;
          saveState();
          renderChain();
          renderEditor();
        };
        chainContainer.appendChild(node);

        if (index < patch.chain.length - 1) {
          const arrow = document.createElement("span");
          arrow.className = "chain-arrow";
          arrow.textContent = "›";
          chainContainer.appendChild(arrow);
        }
      });
    }

    function updateParamValue(blockCode, paramKey, newVal, syncInput = true) {
      const parsed = parseInt(newVal, 10);
      const patch = getCurrentPatch();
      const currentVal = patch.blocks[blockCode].params[paramKey];
      const clamped = Number.isNaN(parsed) ? currentVal : Math.max(0, Math.min(100, parsed));

      patch.blocks[blockCode].params[paramKey] = clamped;
      saveState();
      sendControlChange(20, clamped);

      const slider = document.getElementById(`slider_${paramKey}`);
      const inputBox = document.getElementById(`input_${paramKey}`);
      if (slider) slider.value = clamped;
      if (inputBox && syncInput) inputBox.value = clamped;
      updateStatus(`${blockCode} ${paramKey}: ${clamped}%`);
    }

    function renderEditor() {
      const patch = getCurrentPatch();
      const code = appState.selectedBlock;
      const block = patch.blocks[code];

      blockTitle.textContent = `${code} • ${block.name}`;
      blockToggleBtn.textContent = block.enabled ? "ACTIVE" : "BYPASS";
      blockToggleBtn.className = "toggle-btn " + (block.enabled ? "toggle-on" : "toggle-off");

      paramsContainer.innerHTML = "";
      Object.entries(block.params).forEach(([key, val]) => {
        const group = document.createElement("div");
        group.className = "param-group";

        const top = document.createElement("div");
        top.className = "param-top";

        const label = document.createElement("span");
        label.className = "param-label";
        label.textContent = key;

        const stepper = document.createElement("div");
        stepper.className = "digital-stepper";

        const minusBtn = document.createElement("button");
        minusBtn.className = "step-btn";
        minusBtn.textContent = "−";
        minusBtn.onclick = () => updateParamValue(code, key, patch.blocks[code].params[key] - 1, true);

        const inputBox = document.createElement("input");
        inputBox.type = "number";
        inputBox.min = 0;
        inputBox.max = 100;
        inputBox.className = "digital-input";
        inputBox.id = `input_${key}`;
        inputBox.value = val;
        inputBox.onfocus = (e) => e.target.select();
        inputBox.onchange = (e) => updateParamValue(code, key, e.target.value, true);
        inputBox.onkeydown = (e) => {
          if (e.key === "Enter") {
            updateParamValue(code, key, e.target.value, true);
            e.target.blur();
          }
        };

        const plusBtn = document.createElement("button");
        plusBtn.className = "step-btn";
        plusBtn.textContent = "+";
        plusBtn.onclick = () => updateParamValue(code, key, patch.blocks[code].params[key] + 1, true);

        stepper.appendChild(minusBtn);
        stepper.appendChild(inputBox);
        stepper.appendChild(plusBtn);

        top.appendChild(label);
        top.appendChild(stepper);

        const slider = document.createElement("input");
        slider.type = "range";
        slider.id = `slider_${key}`;
        slider.min = 0;
        slider.max = 100;
        slider.value = val;
        slider.oninput = (e) => updateParamValue(code, key, e.target.value, true);

        group.appendChild(top);
        group.appendChild(slider);
        paramsContainer.appendChild(group);
      });
    }

    blockToggleBtn.onclick = () => {
      const patch = getCurrentPatch();
      const block = patch.blocks[appState.selectedBlock];
      block.enabled = !block.enabled;
      saveState();
      renderChain();
      renderEditor();
      updateStatus(`${appState.selectedBlock} ${block.enabled ? "ACTIVE" : "BYPASS"}`);
    };

    document.getElementById("moveLeftBtn").onclick = () => {
      const patch = getCurrentPatch();
      const idx = patch.chain.indexOf(appState.selectedBlock);
      if (idx > 0) {
        [patch.chain[idx - 1], patch.chain[idx]] = [patch.chain[idx], patch.chain[idx - 1]];
        saveState();
        renderChain();
        updateStatus(`MOVED ${appState.selectedBlock} LEFT`);
      }
    };

    document.getElementById("moveRightBtn").onclick = () => {
      const patch = getCurrentPatch();
      const idx = patch.chain.indexOf(appState.selectedBlock);
      if (idx < patch.chain.length - 1) {
        [patch.chain[idx + 1], patch.chain[idx]]
