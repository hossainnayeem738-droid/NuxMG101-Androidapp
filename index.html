  <script>

    const MIDI_CHANNEL = 0;[cite: 2]

    const BLOCK_CC = {

      AMP: 24,
      IR: 25,
      EQ: 26,
      MOD: 27,
      DLY: 28,
      RVB: 29,
      PL: 31
    };

    const defaultChain = ["NG", "CMP", "EFX", "AMP", "IR", "EQ", "MOD", "DLY", "RVB", "PL"];

    function createDefaultBlocks() {
      return {
        NG: { on: true, p: { Threshold: 40, Decay: 50 } },
        CMP: { on: false, p: { Sustain: 50, Level: 60 } },
        EFX: { on: true, p: { Drive: 55, Tone: 50, Level: 65 } },
        AMP: { on: true, p: { Gain: 86, Master: 68, Bass: 50, Mid: 82, Treble: 55, Presence: 52 } },[cite: 1, 3, 4]
        IR: { on: true, p: { Level: 75, LowCut: 20, HighCut: 80 } },
        EQ: { on: false, p: { B100: 50, B220: 50, B500: 50, B1k2: 50, B2k6: 50, B6k4: 50 } },
        MOD: { on: false, p: { Rate: 45, Depth: 50, Mix: 50 } },
        DLY: { on: false, p: { Time: 40, Feedback: 35, Mix: 30 } },
        RVB: { on: true, p: { Level: 35, Decay: 45, Tone: 50 } },[cite: 1]
        PL: { on: true, p: { Pedal: 100, PatchLevel: 80 } }
      };
    }

    function createDefaultPatches(count = 36) {
      const list = [];
      for (let i = 0; i < count; i++) {
        list.push({
          name: `Patch ${i}`,
          chain: [...defaultChain],
          blocks: createDefaultBlocks()
        });
      }
      return list;
    }

    const state = {
      idx: 0,
      sel: "AMP",
      patches: createDefaultPatches(36)
    };

    function curPatch() {
      return state.patches[state.idx];
    }

    function patchName(idx) {
      return state.patches[idx]?.name || `Patch ${idx}`;
    }

    function setStatus(msg) {
      document.getElementById("statusBox").textContent = msg;[cite: 12]
    }

    function save() {
      try {
        localStorage.setItem("nux_mg101_state_v1", JSON.stringify(state));
      } catch (e) {}
    }

    function loadSaved() {
      try {
        const raw = localStorage.getItem("nux_mg101_state_v1");
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.patches) && parsed.patches.length > 0) {
          state.idx = Math.max(0, Math.min(parsed.patches.length - 1, parsed.idx || 0));
          state.sel = parsed.sel || "AMP";
          state.patches = parsed.patches;
        }
      } catch (e) {}
    }

    function sendProgramChange(patchIndex) {
      if (!midiOut) return;[cite: 2]
      const program = Math.max(0, Math.min(127, patchIndex));[cite: 2]
      midiOut.send([0xC0 | MIDI_CHANNEL, program]);[cite: 2]
      setStatus(`MIDI PC Sent: ${program} (${patchName(program)})`);[cite: 2]
    }

    function sendCC(ccNumber, value0to100) {
      if (!midiOut) return;[cite: 2]
      const ccVal = Math.max(0, Math.min(127, Math.round((value0to100 / 100) * 127)));[cite: 2]
      midiOut.send([0xB0 | MIDI_CHANNEL, ccNumber, ccVal]);[cite: 2]

      const outs = Array.from(midiAccess.outputs.values());[cite: 2]
      if (outs.length > 0) {

        setStatus(`OTG CONNECTED: ${midiOut.name}`);[cite: 2, 12]

      }
    }

    function renderPatchBar() {
      document.getElementById("patchName").textContent = patchName(state.idx);
    }

    function renderChainBar() {
      const bar = document.getElementById("signalChainBar");
      bar.innerHTML = "";
      const p = curPatch();
      p.chain.forEach((blkId) => {
        const blk = p.blocks[blkId];
        const btn = document.createElement("button");
        btn.textContent = blkId;
        btn.className = "chain-btn";
        if (!blk.on) btn.classList.add("off-block");
        if (state.sel === blkId) btn.classList.add("active-block");
        btn.onclick = () => {
          state.sel = blkId;
          save();
          renderAll();
        };
        bar.appendChild(btn);
      });
    }

    function renderParams() {
      const p = curPatch();
      const curBlk = p.blocks[state.sel];
      document.getElementById("blockTitle").textContent = `${state.sel} Controls`;
      document.getElementById("blockToggle").checked = curBlk.on;[cite: 10]

      const paramsEl = document.getElementById("paramsContainer");[cite: 10]
      paramsEl.innerHTML = "";[cite: 10]

      Object.entries(curBlk.p).forEach(([k, val], index) => {[cite: 10]
        const grp = document.createElement("div");[cite: 10]
        grp.className = "param-group";[cite: 10]

        const top = document.createElement("div");
        top.className = "param-top";

        const lbl = document.createElement("span");
        lbl.className = "param-label";
        lbl.textContent = k;

        const stepper = document.createElement("div");
        stepper.className = "digital-stepper";

        const decBtn = document.createElement("button");
        decBtn.type = "button";
        decBtn.textContent = "-";

        const numIn = document.createElement("input");
        numIn.type = "number";
        numIn.min = "0";
        numIn.max = "100";
        numIn.value = val;

        const incBtn = document.createElement("button");
        incBtn.type = "button";
        incBtn.textContent = "+";

        const rangeIn = document.createElement("input");
        rangeIn.type = "range";
        rangeIn.min = "0";
        rangeIn.max = "100";
        rangeIn.value = val;

        const paramCC = (BLOCK_CC[state.sel] || 21) + 20 + index;

        const applyValue = (nextVal) => {
          const clamped = Math.max(0, Math.min(100, Number(nextVal) || 0));
          curBlk.p[k] = clamped;
          numIn.value = clamped;
          rangeIn.value = clamped;
          sendCC(paramCC, clamped);
          save();
        };

        decBtn.onclick = () => applyValue(curBlk.p[k] - 1);
        incBtn.onclick = () => applyValue(curBlk.p[k] + 1);
        numIn.onchange = () => applyValue(numIn.value);
        rangeIn.oninput = () => applyValue(rangeIn.value);

        top.appendChild(lbl);
        stepper.appendChild(decBtn);
        stepper.appendChild(numIn);
        stepper.appendChild(incBtn);
        top.appendChild(stepper);

        grp.appendChild(top);
        grp.appendChild(rangeIn);
        paramsEl.appendChild(grp);[cite: 10]
      });
    }

    function renderAll() {
      renderPatchBar();
      renderChainBar();
      renderParams();
    }

    document.getElementById("blockToggle").onchange = () => {[cite: 10]
      const b = curPatch().blocks[state.sel];[cite: 10]
      if (!b) return;[cite: 10]
      b.on = !b.on;[cite: 10]
      sendCC(BLOCK_CC[state.sel] || 21, b.on ? 100 : 0);[cite: 10]
      save();[cite: 10]
      renderAll();[cite: 10]
      setStatus(`${state.sel} ${b.on ? "ACTIVE" : "BYPASSED"}`);[cite: 10]
    };

    document.getElementById("moveLeftBtn").onclick = () => {[cite: 11]
      const c = curPatch().chain;[cite: 11]
      const i = c.indexOf(state.sel);[cite: 11]
      if (i > 0) {[cite: 11]
        [c[i - 1], c[i]] = [c[i], c[i - 1]];[cite: 11]
        sendCC(30, Math.round((i / Math.max(1, c.length - 1)) * 100));[cite: 11]
        save();[cite: 11]
        renderAll();[cite: 11]
        setStatus(`MOVED ${state.sel} LEFT`);[cite: 11]
      }
    };

    document.getElementById("moveRightBtn").onclick = () => {[cite: 11]
      const c = curPatch().chain;[cite: 11]
      const i = c.indexOf(state.sel);[cite: 11]
      if (i >= 0 && i < c.length - 1) {[cite: 11]
        [c[i + 1], c[i]] = [c[i], c[i + 1]];[cite: 11]
        sendCC(30, Math.round(((i + 1) / Math.max(1, c.length - 1)) * 100));[cite: 11]
        save();[cite: 11]
        renderAll();[cite: 11]
        setStatus(`MOVED ${state.sel} RIGHT`);[cite: 11]
      }
    };

    document.getElementById("prevPatch").onclick = () => {[cite: 12]
      state.idx = Math.max(0, state.idx - 1);
      sendProgramChange(state.idx);
      save();
      renderAll();
    };

    document.getElementById("nextPatch").onclick = () => {[cite: 12]
      state.idx = Math.min(state.patches.length - 1, state.idx + 1);
      sendProgramChange(state.idx);
      save();
      renderAll();
    };

    document.getElementById("resetPatchBtn").onclick = () => {[cite: 12]
      state.patches[state.idx] = {[cite: 12]
        name: `Patch ${state.idx}`,

        blocks: createDefaultBlocks()
      };
      save();[cite: 12]
      renderAll();[cite: 12]
      setStatus(`RESET ${patchName(state.idx)}`);[cite: 12]
    };
