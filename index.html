<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NUX MG-101 QuickTone Digital Studio</title>
  <style>
    :root {
      --bg: #0c0f12;
      --card: #15191e;
      --card-2: #1b2026;
      --border: #2a313a;
      --text: #eef2f6;
      --muted: #9aa7b6;
      --accent: #1e88e5;
      --green: #2e7d32;
      --green-bright: #4caf50;
      --amber: #ffb300;
      --red: #d32f2f;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app-wrap {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-danger {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .status-strip {
      background: #102030;
      border: 1px solid #1f4668;
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      gap: 8px;
    }

    .midi-pill {
      padding: 3px 8px;
      border-radius: 999px;
      background: #24292e;
      color: #cfd8dc;
      font-size: 11px;
    }

    .midi-pill.connected {
      background: #1b3b22;
      color: #81c784;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .patch-nav-row {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .patch-display {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }

    .patch-code {
      font-size: 20px;
      font-weight: 900;
      color: #64b5f6;
    }

    .patch-name-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .name-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .name-input {
      flex: 1;
      background: #0f1317;
      border: 1px solid var(--amber);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .bank-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .mini-btn {
      padding: 8px 4px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .mini-btn.active {
      background: var(--accent);
      border-color: #64b5f6;
      color: #fff;
    }

    .eb-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    @media (max-width: 520px) {
      .eb-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .eb-tile {
      background: #181a19;
      border: 1px solid #2b2f2d;
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      color: #d6dbd8;
      transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .eb-tile:active {
      transform: scale(0.97);
    }

    .eb-tile.is-on {
      border-color: var(--green-bright);
      background: #1c241e;
    }

    .eb-tile.is-selected {
      outline: 2px solid var(--amber);
      border-color: var(--amber);
    }

    .eb-tile.is-off {
      opacity: 0.65;
    }

    .eb-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .eb-submodel {
      font-size: 10px;
      color: #9fb0c2;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .eb-icon {
      width: 36px;
      height: 36px;
      image-rendering: pixelated;
    }

    .chain-move-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .model-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 12px;
    }

    .model-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .model-select {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      background: #101418;
      color: #fff;
      border: 1px solid #35414d;
      font-size: 13px;
      font-weight: 600;
    }

    .param-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .param-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .param-name {
      font-size: 13px;
      font-weight: 700;
    }

    .param-cc {
      font-size: 11px;
      color: var(--muted);
      margin-left: 4px;
    }

    .stepper-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-btn {
      width: 34px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #12161a;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .val-badge {
      min-width: 44px;
      text-align: center;
      padding: 4px 8px;
      border-radius: 8px;
      background: #0d47a1;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2196f3;
      cursor: pointer;
    }

    .toggle-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .toggle-btn.on {
      background: var(--green-bright);
      color: #09130a;
    }

    .toggle-btn.off {
      background: #2c323a;
      color: #cfd8dc;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="topbar">
      <div>
        <div class="brand-title">NUX MG-101 QUICKTONE STUDIO</div>
        <div class="brand-sub">OTG / Web MIDI Effect Controller</div>
      </div>
      <button id="connectBtn" class="btn btn-danger">Connect via OTG</button>
    </div>

    <div class="status-strip">
      <span id="statusText">SELECTED: AMP (Amplifier)</span>
      <span id="midiStatus" class="midi-pill">MIDI: OFF</span>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Patch Bank & Slot (1A–10D)</span>
        <button id="resetPatchBtn" class="btn" style="padding:5px 10px;font-size:11px;">Reset Patch</button>
      </div>

      <div class="patch-nav-row">
        <button id="prevPatchBtn" class="btn">◀ Prev</button>
        <div class="patch-display">
          <div id="patchCodeDisplay" class="patch-code">1B</div>
          <div id="patchNameDisplay" class="patch-name-sub">Patch 1B</div>
        </div>
        <button id="nextPatchBtn" class="btn">Next ▶</button>
      </div>

      <div class="name-row">
        <input id="patchNameInput" class="name-input" type="text" maxlength="16" placeholder="Patch Name" />
        <button id="setNameBtn" class="btn btn-primary">Set Name</button>
      </div>

      <div id="bankGrid" class="bank-grid"></div>
      <div id="slotGrid" class="slot-grid"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Signal Chain / Effect Blocks (Tap Block to Edit)</span>
      </div>

      <div id="effectBlocksGrid" class="eb-grid"></div>

      <div class="chain-move-row">
        <button id="moveLeftBtn" class="btn">◀ Move Left</button>
        <button id="moveRightBtn" class="btn">Move Right ▶</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span id="activeBlockTitle" class="card-title">AMP • AMPLIFIER</span>
        <button id="blockPowerBtn" class="toggle-btn on">ACTIVE</button>
      </div>

      <div id="selectedModelRow" class="model-row">
        <span class="model-label">Effect Model:</span>
        <select id="modelSelect" class="model-select"></select>
      </div>

      <div id="paramsContainer"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "nux_mg101_studio_state_v1";

    const BLOCK_CC = {
      NR: 21,
      CMP: 22,
      EFX: 23,
      AMP: 24,
      IR: 25,
      EQ: 26,
      MOD: 27,
      DLY: 28,
