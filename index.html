<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NUX MG-101 QuickTone Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #171d2b 0%, #0b0d12 65%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      gap: 12px;
      min-height: 100vh;
    }
    .top-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #121722;
      border: 1px solid #242d3d;
      border-radius: 14px;
      padding: 12px 14px;
    }
    .brand-title { font-size: 17px; font-weight: 800; color: #f8fafc; }
    .brand-sub { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #38bdf8; }
    .btn-otg {
      background: #dc2626;
      color: #fff;
      border: 1px solid #f87171;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .status-bar {
      width: 100%;
      max-width: 450px;
      background: #0d1118;
      border: 1px solid #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 10px;
      padding: 9px 12px;
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      color: #7dd3fc;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .card {
      width: 100%;
      max-width: 450px;
      background: #121722;
      border: 1px solid #222b3a;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: #cbd5e1; }
    .btn-reset {
      background: #1b2232;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .patch-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .btn-nav {
      background: #1a2232;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .patch-lcd {
      flex: 1;
      background: #06080c;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      font-family: monospace;
      font-size: 26px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 2px;
    }
    .bank-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
    .q-btn {
      background: #171e2c;
      color: #cbd5e1;
      border: 1px solid #2b364b;
      border-radius: 8px;
      padding: 7px 4px;
      font-family: monospace;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .q-btn.active { background: #0284c7; color: #fff; border-color: #7dd3fc; }

    .chain-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; padding: 4px 0; }
    .chain-node {
      padding: 9px 4px;
      border-radius: 10px;
      background: #171e2c;
      border: 1.5px solid #2b364b;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .chain-node.active { background: #122436; border-color: #22c55e; }
    .chain-node.selected { border-color: #facc15; box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.45); }
    .node-code { font-size: 12px; font-weight: 900; color: #f8fafc; }
    .node-dot { width: 8px; height: 8px; border-radius: 50%; margin: 6px auto 0; background: #475569; }
    .chain-node.active .node-dot { background: #22c55e; }

    .order-controls { display: flex; gap: 8px; }
    .btn-small {
      flex: 1;
      background: #171e2c;
      color: #e2e8f0;
      border: 1px solid #2b364b;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-small:active { background: #2563eb; border-color: #60a5fa; }

    .block-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .toggle-btn { padding: 6px 14px; border-radius: 20px; border: none; font-size: 12px; font-weight: 800; cursor: pointer; }
    .toggle-on { background: #22c55e; color: #052e16; }
    .toggle-off { background: #273042; color: #94a3b8; }

    .param-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0d1118;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #1e2736;
    }
    .param-top { display: flex; justify-content: space-between; align-items: center; }
    .param-label { font-size: 13px; font-weight: 700; color: #e2e8f0; }
    .digital-stepper { display: flex; align-items: center; gap: 5px; }
    .step-btn {
      width: 28px;
      height: 28px;
      background: #1b2333;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .digital-input {
      width: 54px;
      height: 28px;
      background: #06080c;
      border: 1px solid #25446b;
      border-radius: 7px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 800;
      color: #38bdf8;
      text-align: center;
    }
    input[type="range"] { width: 100%; accent-color: #38bdf8; height: 6px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      <div class="brand-title">NUX MG-101</div>
      <div class="brand-sub">QUICKTONE DIGITAL STUDIO</div>
    </div>
    <button class="btn-otg" id="connectBtn">Connect via OTG</button>
  </div>

  <div class="status-bar" id="statusBar">
    <span>READY • AUTO-SAVE ON</span>
    <span>MIDI: OFF</span>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Patch Bank & Slot (1A–10D)</div>
      <button class="btn-reset" id="resetPatchBtn">Reset Patch</button>
    </div>
    <div class="patch-row">
      <button class="btn-nav" id="prevPatch">◀ Prev</button>
      <div class="patch-lcd" id="patchDisplay">1A</div>
      <button class="btn-nav" id="nextPatch">Next ▶</button>
    </div>
    <div>
      <div class="bank-grid" id="bankGrid"></div>
      <div class="slot-grid" id="slotGrid"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Signal Chain (Tap Block to Edit)</div>
    <div class="chain-grid" id="chainContainer"></div>
    <div class="order-controls">
      <button class="btn-small" id="moveLeftBtn">◀ Move Left</button>
      <button class="btn-small" id="moveRightBtn">Move Right ▶</button>
    </div>
  </div>

  <div class="card">
    <div class="block-header">
      <span class="card-title" id="blockTitle">AMP • Amplifier</span>
      <button class="toggle-btn toggle-on" id="blockToggleBtn">ACTIVE</button>
    </div>
    <div id="paramsContainer" style="display:flex; flex-direction:column; gap:9px;"></div>
  </div>
