<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NUX MG-101 QuickTone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0d12; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; padding: 14px; gap: 12px; min-height: 100vh; }
    .top-bar { width: 100%; max-width: 450px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #121722; border: 1px solid #242d3d; border-radius: 14px; padding: 12px 14px; }
    .brand-title { font-size: 17px; font-weight: 800; color: #f8fafc; }
    .brand-sub { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #38bdf8; }
    .btn-otg { background: #dc2626; color: #fff; border: 1px solid #f87171; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .status-bar { width: 100%; max-width: 450px; background: #0d1118; border: 1px solid #1e293b; border-left: 4px solid #38bdf8; border-radius: 10px; padding: 9px 12px; font-family: monospace; font-size: 12px; font-weight: 700; color: #7dd3fc; display: flex; justify-content: space-between; }
    .card { width: 100%; max-width: 450px; background: #121722; border: 1px solid #222b3a; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: #cbd5e1; }
    .btn-reset { background: #1b2232; color: #94a3b8; border: 1px solid #334155; border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .patch-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .btn-nav { background: #1a2232; color: #f1f5f9; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .patch-lcd { flex: 1; background: #06080c; border: 1px solid #1e3a5f; border-radius: 10px; padding: 8px; text-align: center; font-family: monospace; font-size: 26px; font-weight: 900; color: #38bdf8; letter-spacing: 2px; }
    .bank-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
    .q-btn { background: #171e2c; color: #cbd5e1; border: 1px solid #2b364b; border-radius: 8px; padding: 7px 4px; font-family: monospace; font-size: 12px; font-weight: 800; cursor: pointer; }
    .q-btn.active { background: #0284c7; color: #fff; border-color: #7dd3fc; }
    .chain-scroll { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding: 6px 2px; }
    .chain-node { min-width: 54px; padding: 9px 5px; border-radius: 10px; background: #171e2c; border: 1.5px solid #2b364b; text-align: center; cursor: pointer; }
    .chain-node.active { background: #122436; border-color: #22c55e; }
    .chain-node.selected { border-color: #facc15; box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.45); }
    .node-code { font-size: 12px; font-weight: 900; color: #f8fafc; }
    .node-dot { width: 8px; height: 8px; border-radius: 50%; margin: 6px auto 0; background: #475569; }
    .chain-node.active .node-dot { background: #22c55e; }
    .chain-arrow { color: #64748b; font-size: 12px; font-weight: 800; }
    .order-controls { display: flex; gap: 8px; }
    .btn-small { flex: 1; background: #171e2c; color: #e2e8f0; border: 1px solid #2b364b; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .block-header { display: flex; justify-content: space-between; align-items: center; }
    .toggle-btn { padding: 6px 14px; border-radius: 20px; border: none; font-size: 12px; font-weight: 800; cursor: pointer; }
    .toggle-on { background: #22c55e; color: #052e16; }
    .toggle-off { background: #273042; color: #94a3b8; }
    .param-group { display: flex; flex-direction: column; gap: 8px; background: #0d1118; padding: 10px 12px; border-radius: 10px; border: 1px solid #1e2736; }
    .param-top { display: flex; justify-content: space-between; align-items: center; }
    .param-label { font-size: 13px; font-weight: 700; color: #e2e8f0; }
    .digital-stepper { display: flex; align-items: center; gap: 5px; }
    .step-btn { width: 28px; height: 28px; background: #1b2333; color: #f8fafc; border: 1px solid #334155; border-radius: 7px; font-size: 15px; font-weight: 800; cursor: pointer; }
    .digital-input { width: 54px; height: 28px; background: #06080c; border: 1px solid #25446b; border-radius: 7px; font-family: monospace; font-size: 13px; font-weight: 800; color: #38bdf8; text-align: center; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; height: 6px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      <div class="brand-title">NUX MG-101</div>
      <div class="brand-sub">QUICKTONE DIGITAL STUDIO</div>
    </div>
    <button class="btn-otg" id="connectBtn">Connect via OTG</button>
  </div>

  <div class="status-bar" id="statusBar">
    <span>READY • AUTO-SAVE ON</span>
    <span>MIDI: OFF</span>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Patch Bank & Slot (1A–10D)</div>
      <button class="btn-reset" id="resetPatchBtn">Reset Patch</button>
    </div>
    <div class="patch-row">
      <button class="btn-nav" id="prevPatch">◀ Prev</button>
      <div class="patch-lcd" id="patchDisplay">1A</div>
      <button class="btn-nav" id="nextPatch">Next ▶</button>
    </div>
    <div>
      <div class="bank-grid" id="bankGrid"></div>
      <div class="slot-grid" id="slotGrid"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Signal Chain (Tap Block to Edit)</div>
    <div class="chain-scroll" id="chainContainer"></div>
    <div class="order-controls">
      <button class="btn-small" id="moveLeftBtn">◀ Move Left</button>
      <button class="btn-small" id="moveRightBtn">Move Right ▶</button>
    </div>
  </div>

  <div class="card">
    <div class="block-header">
      <span class="card-title" id="blockTitle">AMP • Amplifier</span>
      <button class="toggle-btn toggle-on" id="blockToggleBtn">ACTIVE</button>
    </div>
    <div id="paramsContainer" style="display:flex; flex-direction:column; gap:9px;"></div>
  </div>

  <script>
    const KEY = "nux_qt_v2";
    const LETTERS = ["A", "B", "C", "D"];
    let midiAccess = null, midiOut = null;

    function defaultPatch() {
      return {
        chain: ["NR", "EFX", "AMP", "IR", "EQ", "MOD", "DLY", "RVB"],
        blocks: {
          NR:  { name: "Noise Gate", on: true,  p: { Threshold: 35, Decay: 40 } },
          EFX: { name: "Overdrive",  on: true,  p: { Drive: 55, Tone: 60, Level: 70 } },
          AMP: { name: "Amplifier",  on: true,  p: { Gain: 75, Master: 70, Bass: 55, Middle: 50, Treble: 65 } },
          IR:  { name: "Cabinet IR", on: true,  p: { Level: 80, LowCut: 20, HighCut: 75 } },
          EQ:  { name: "6-Band EQ",  on: false, p: { "100Hz": 50, "220Hz": 50, "500Hz": 52, "1.2kHz": 55, "2.6kHz": 54, "6.4kHz": 50 } },
          MOD: { name: "Modulation", on: false, p: { Rate: 40, Depth: 50, Mix: 45 } },
          DLY: { name: "Delay",      on: true,  p: { Time: 45, Feedback: 35, Mix: 30 } },
          RVB: { name: "Reverb",     on: true,  p: { Decay: 50, Tone: 60, Mix: 35 } }
        }
      };
    }

    let state = { idx: 0, sel: "AMP", patches: {} };
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed.idx === "number" && parsed.patches) state = parsed;
      }
    } catch (e) {}

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    function curPatch() {
      if (!state.patches[state.idx] || !state.patches[state.idx].blocks) {
        state.patches[state.idx] = defaultPatch();
      }
      return state.patches[state.idx];
    }

    function patchName(i) {
      return (Math.floor(i / 4) + 1) + LETTERS[i % 4];
    }

    function setStatus(txt) {
      const m = midiOut ? "MIDI: " + midiOut.name : "MIDI: OFF";
      document.getElementById("statusBar").innerHTML = "<span>" + txt + "</span><span>" + m + "</span>";
    }

    function sendPC(i) {
      if (midiOut) midiOut.send([0xC0, Math.max(0, Math.min(127, i))]);
    }

    function sendCC(cc, v) {
      if (midiOut) midiOut.send([0xB0, cc, Math.max(0, Math.min(127, Math.round((v / 100) * 127)))]);
    }

    function selectPatch(newIdx) {
      state.idx = (newIdx + 40) % 40;
      save();
      sendPC(state.idx);
      renderAll();
      setStatus("PATCH " + patchName(state.idx) + " LOADED");
    }

    function setParam(code, k, v) {
      const n = parseInt(v, 10);
      const p = curPatch();
      const val = isNaN(n) ? p.blocks[code].p[k] : Math.max(0, Math.min(100, n));
      p.blocks[code].p[k] = val;
      save();
      sendCC(20, val);
      const sl = document.getElementById("sl_" + k);
      const inp = document.getElementById("in_" + k);
      if (sl) sl.value = val;
      if (inp) inp.value = val;
      setStatus(code + " " + k + ": " + val + "%");
    }

    function renderAll() {
      const p = curPatch();
      document.getElementById("patchDisplay").textContent = patchName(state.idx);

      const bGrid = document.getElementById("bankGrid");
      const sGrid = document.getElementById("slotGrid");
      const activeB = Math.floor(state.idx / 4);
      const activeS = state.idx % 4;
      bGrid.innerHTML = "";
      for (let b = 0; b < 10; b++) {
        const btn = document.createElement("button");
        btn.className = "q-btn" + (b === activeB ? " active" : "");
        btn.textContent = "B" + (b + 1);
        btn.onclick = () => selectPatch(b * 4 + activeS);
        bGrid.appendChild(btn);
      }
      sGrid.innerHTML = "";
      LETTERS.forEach((lt, s) => {
        const btn = document.createElement("button");
        btn.className = "q-btn" + (s === activeS ? " active" : "");
        btn.textContent = (activeB + 1) + lt;
        btn.onclick = () => selectPatch(activeB * 4 + s);
        sGrid.appendChild(btn);
      });

      const chainEl = document.getElementById("chainContainer");
      chainEl.innerHTML = "";
      p.chain.forEach((code, i) => {
        const blk = p.blocks[code];
        const node = document.createElement("div");
        node.className = "chain-node" + (blk.on ? " active" : "") + (state.sel === code ? " selected" : "");
        node.innerHTML = '<div class="node-code">' + code + '</div><div class="node-dot"></div>';
        node.onclick = () => { state.sel = code; save(); renderAll(); };
        chainEl.appendChild(node);
        if (i < p.chain.length - 1) {
          const ar = document.createElement("span");
          ar.className = "chain-arrow";
          ar.textContent = "›";
          chainEl.appendChild(ar);
        }
      });

      const curBlk = p.blocks[state.sel];
      document.getElementById("blockTitle").textContent = state.sel + " • " + curBlk.name;
      const tBtn = document.getElementById("blockToggleBtn");
      tBtn.textContent = curBlk.on ? "ACTIVE" : "BYPASS";
      tBtn.className = "toggle-btn " + (curBlk.on ? "toggle-on" : "toggle-off");

      const paramsEl = document.getElementById("paramsContainer");
      paramsEl.innerHTML = "";
      Object.entries(curBlk.p).forEach(([k, val]) => {
        const grp = document.createElement("div");
        grp.className = "param-group";
        grp.innerHTML =
          '<div class="param-top">' +
            '<span class="param-label">' + k + '</span>' +
            '<div class="digital-stepper">' +
              '<button class="step-btn" id="m_' + k + '">−</button>' +
              '<input type="number" min="0" max="100" class="digital-input" id="in_' + k + '" value="' + val + '" />' +
              '<button class="step-btn" id="p_' + k + '">+</button>' +
            '</div>' +
          '</div>' +
          '<input type="range" min="0" max="100" id="sl_' + k + '" value="' + val + '" />';
        paramsEl.appendChild(grp);

        document.getElementById("m_" + k).onclick = () => setParam(state.sel, k, curBlk.p[k] - 1);
        document.getElementById("p_" + k).onclick = () => setParam(state.sel, k, curBlk.p[k] + 1);
        document.getElementById("in_" + k).onchange = (e) => setParam(state.sel, k, e.target.value);
        document.getElementById("sl_" + k).oninput = (e) => setParam(state.sel, k, e.target.value);
      })
      const BLOCK_CC = { NR: 21, EFX: 22, AMP: 23, IR: 24, EQ: 25, MOD: 26, DLY: 27, RVB: 28 };

    function sendCC(cc, v) {
      if (midiOut) midiOut.send([0xB0, cc, Math.max(0, Math.min(127, Math.round((v / 100) * 127)))]);
    }

    document.getElementById("blockToggleBtn").onclick = () => {
      const b = curPatch().blocks[state.sel];
      if (!b) return;
      b.on = !b.on;
      sendCC(BLOCK_CC[state.sel] || 21, b.on ? 100 : 0);
      save();
      renderAll();
      setStatus(state.sel + (b.on ? " ACTIVE" : " BYPASS"));
    };

    document.getElementById("moveLeftBtn").onclick = () => {
      const c = curPatch().chain;
      const i = c.indexOf(state.sel);
      if (i > 0) {
        [c[i - 1], c[i]] = [c[i], c[i - 1]];
        sendCC(30, Math.round((i / Math.max(1, c.length - 1)) * 100));
        save();
        renderAll();
        setStatus("MOVED " + state.sel + " LEFT");
      }
    };

    document.getElementById("moveRightBtn").onclick = () => {
      const c = curPatch().chain;
      const i = c.indexOf(state.sel);
      if (i >= 0 && i < c.length - 1) {
        [c[i + 1], c[i]] = [c[i], c[i + 1]];
        sendCC(30, Math.round(((i + 1) / Math.max(1, c.length - 1)) * 100));
        save();
        renderAll();
        setStatus("MOVED " + state.sel + " RIGHT");
      }
    };

    renderAll();
  </script>
</body>
</html>
