 HTML/JavaScript <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUX MG-101 Mobile Editor</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    button { background: #e63946; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 10px; }
    #status { margin: 20px 0; padding: 15px; background: #1e1e1e; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>🎸 NUX MG-101 Mobile App</h2>
  <p>OTG কেবল দিয়ে পেডালটি ফোনে যুক্ত করুন</p>
  <button onclick="connectMidi()">Connect MG-101</button>
  <div id="status">Status: Not Connected</div>

  <script>
    let midiOutput = null;

    async function connectMidi() {
      const statusDiv = document.getElementById('status');
      if (!navigator.requestMIDIAccess) {
        statusDiv.innerText = "আপনার ব্রাউজার WebMIDI সাপোর্ট করে না। Chrome ব্যবহার করুন।";
        return;
      }
      try {
        const midiAccess = await navigator.requestMIDIAccess({ sysex: true });
        for (let output of midiAccess.outputs.values()) {
          if (output.name.includes("NUX") || output.name.includes("MG-101")) {
            midiOutput = output;
            statusDiv.innerText = "Connected to: " + output.name;
            statusDiv.style.color = "#4ade80";
            return;
          }
        }
        statusDiv.innerText = "NUX MG-101 খুঁজে পাওয়া যায়নি। OTG চেক করুন।";
      } catch (err) {
        statusDiv.innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
