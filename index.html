<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
<body style="background:#0c0f12;color:#fff;font-family:sans-serif;padding:16px;">
  <div id="st">LOADING...</div>
  <input id="nameInp" placeholder="Patch Name" style="padding:8px;">
  <button id="setBtn" style="padding:8px;">Set Name</button>
  <div id="out" style="margin-top:12px;"></div>
  <script>
    document.getElementById("st").textContent = "JS OK - READY";
    var chain = ["NR","EFX","AMP","IR","EQ","MOD","DLY","RVB"];
    document.getElementById("out").innerHTML = chain.join(" -> ");
    document.getElementById("setBtn").onclick = function () {
      document.getElementById("out").textContent = "NAME: " + document.getElementById("nameInp").value;
    };
  </script>
</body>
</html>
