<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NUX MG-101 Digital Rig Studio v2.6</title>
  <style>
    :root{
      --bg:#090c12;--card:#121720;--card2:#1a212e;--border:#2b3648;
      --text:#f1f5f9;--muted:#94a3b8;--amber:#f59e0b;--cream:#d6dfc2;
      --blue:#2563eb;--green:#22c55e;--red:#ef4444;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;padding:10px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
    .app{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
    .card{background:linear-gradient(180deg,#151b26 0%,#0f141d 100%);border:1px solid var(--border);border-radius:12px;padding:10px;overflow-x:hidden;box-shadow:0 10px 24px rgba(0,0,0,0.5);}
    .row{display:flex;gap:8px;align-items:center;justify-content:space-between;}
    .grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
    .grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px;}
    .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px;}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px;}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;}
    button,input,select{font-family:inherit;color:var(--text);background:var(--card2);border:1px solid #303c52;border-radius:8px;padding:6px 8px;font-weight:700;cursor:pointer;min-width:0;}
    input{flex:1;background:#090d14;border-color:#2f3b50;font-weight:600;cursor:text;}
    .amber-btn{background:linear-gradient(180deg,#f59e0b 0%,#d97706 100%);border-color:#fbbf24;color:#090d14;font-weight:900;}
    .blue-btn{background:linear-gradient(180deg,#3b82f6 0%,#1d4ed8 100%);border-color:#60a5fa;color:#fff;}

    .top-bar{background:#0c1017;border:1px solid #232d3f;border-radius:10px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;font-weight:800;}
    .brand-mark{font-size:12.5px;font-weight:900;letter-spacing:0.5px;color:#f8fafc;}
    .brand-mark span{color:var(--amber);}
    .midi-pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:9.5px;font-weight:800;border:1px solid #334155;background:#121824;color:#e2e8f0;}
    .midi-dot{width:7px;height:7px;border-radius:50%;background:var(--red);}
    .midi-pill.connected .midi-dot{background:var(--green);box-shadow:0 0 8px var(--green);}

    .patch-grid{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:6px;}
    .patch-left{display:flex;flex-direction:column;align-items:center;gap:5px;}
    .patch-box{background:linear-gradient(180deg,#f59e0b 0%,#d97706 100%);border:1.5px solid #fde68a;border-radius:10px;padding:7px 14px;text-align:center;box-shadow:0 0 16px rgba(245,158,11,0.35);min-width:76px;color:#090d14;}
    .patch-num{font-size:24px;font-weight:900;line-height:1.05;}
    .patch-sub{font-size:7.5px;font-weight:900;letter-spacing:0.3px;margin-top:2px;}
    .step-row{display:flex;gap:4px;width:100%;}
    .step-row button{flex:1;padding:5px 4px;font-size:9.5px;}

    .bank-mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;}
    .bank-mini button{padding:4px 2px;font-size:9.5px;border-radius:5px;}
    .slot-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:5px;}
    .slot-mini button{padding:5px 2px;font-size:10px;border-radius:6px;}

    /* Hardware Round Buttons */
    .hw-btn{background:radial-gradient(circle at 35% 30%,#273142 0%,#111620 85%);border:1.5px solid #39465c;border-radius:50%;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font-size:8px;font-weight:900;line-height:1.1;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,0.45);}
    .hw-led{width:10px;height:3px;border-radius:2px;background:#475569;margin-bottom:3px;}
    .hw-btn.active{border-color:var(--amber);box-shadow:0 0 10px rgba(245,158,11,0.35);}
    .hw-btn.active .hw-led{background:var(--amber);box-shadow:0 0 6px var(--amber);}
    .hw-btn.green-on{border-color:var(--green);}
    .hw-btn.green-on .hw-led{background:var(--green);box-shadow:0 0 6px var(--green);}

    .sec-title{font-size:11px;font-weight:900;color:#e2e8f0;text-transform:uppercase;letter-spacing:0.65px;margin-bottom:6px;}
    .grp-label{font-size:11px;font-weight:800;color:#f59e0b;margin:10px 0 6px 0;border-left:3px solid var(--amber);padding-left:7px;}

    /* 10-Block Signal Chain */
    .chain-blk{background:linear-gradient(180deg,#1c2331 0%,#111620 100%);border:1px solid #2b3648;border-radius:8px;padding:6px 4px;text-align:center;min-width:0;}
    .chain-blk.sel{outline:2px solid var(--amber);border-color:var(--amber);background:linear-gradient(180deg,#2a2419 0%,#161410 100%);box-shadow:0 0 14px rgba(245,158,11,0.3);}
    .chain-dot{display:block;width:6px;height:6px;border-radius:50%;margin:0 auto 3px auto;background:#475569;}
    .chain-blk.on .chain-dot{background:var(--green);box-shadow:0 0 7px var(--green);}
    .blk-code{display:block;font-size:10.5px;font-weight:900;color:#fff;}
    .blk-model{display:block;font-size:8px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}

    /* Cream Rotary Knobs (SELECT, 1, 2, 3) */
    .knob-box{background:#0d121a;border:1px solid #253042;border-radius:9px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;}
    .knob-dial{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eef4e1 0%,#c7d2b0 70%,#9aa683 100%);border:2.5px solid #1e293b;box-shadow:0 4px 10px rgba(0,0,0,0.65),inset 0 1px 2px #fff;position:relative;display:flex;align-items:center;justify-content:center;}
    .knob-ptr{position:absolute;top:4px;left:50%;width:3px;height:13px;background:#111827;border-radius:2px;transform-origin:50% 17px;}
    .knob-lbl{font-size:8.5px;font-weight:900;color:#94a3b8;text-transform:uppercase;}
    .knob-val{font-size:10.5px;font-weight:900;color:#fbbf24;background:#080b10;border:1px solid #283345;border-radius:5px;padding:2px 6px;min-width:44px;}
    .k-step{display:flex;gap:4px;width:100%;justify-content:center;}
    .k-step button{padding:2px 8px;font-size:11px;border-radius:5px;}

    /* Realistic Gear Cards */
    .gear-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
    .gear-card{background:linear-gradient(180deg,#181f2c 0%,#0f141d 100%);border:1px solid #293446;border-radius:9px;padding:5px 4px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;}
    .gear-card.active{border-color:var(--amber);outline:2px solid var(--amber);background:linear-gradient(180deg,#262118 0%,#14120e 100%);box-shadow:0 0 14px rgba(245,158,11,0.32);}
    .gear-canvas{width:100%;height:68px;border-radius:6px;display:block;background:#080b10;}
    .gear-name{font-size:9px;font-weight:800;line-height:1.15;color:#f1f5f9;word-break:break-word;}

    /* Mic & Parameter Grid */
    .mic-panel{background:#0e131b;border:1px solid #283345;border-radius:10px;padding:9px;margin-top:10px;}
    .mic-card{position:relative;background:linear-gradient(180deg,#171e2b 0%,#0e131c 100%);border:1px solid #293446;border-radius:9px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
    .mic-card.active{border-color:var(--amber);outline:2px solid var(--amber);background:#211d15;}
    .mic-canvas{width:44px;height:44px;display:block;}
    .param-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px;}
    .param-box{background:#0d121a;border:1px solid #253042;border-radius:8px;padding:7px 8px;}
    .p-mini-btn{padding:2px 7px;font-size:12px;border-radius:5px;}

    /* Utilities: Loop, Drum, Tuner */
    .util-box{background:#0d121a;border:1px solid #253042;border-radius:9px;padding:7px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;}
    .tuner-bar{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin-top:4px;}
    .tuner-led{height:6px;border-radius:2px;background:#1e293b;}
    .tuner-led.mid{background:#22c55e;box-shadow:0 0 6px #22c55e;}
  </style>
</head>
<body>
<div class="app">
<div class="top-bar">
    <div class="brand-mark">N<span>U</span>X MG-101 • M-VAVE STUDIO</div>
    <button id="midiBtn" class="midi-pill" type="button">
      <span class="midi-dot"></span>
      <span id="midiState">CONNECT OTG MIDI</span>
    </button>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:4px;">
      <div>
        <div style="font-size:13px;font-weight:900;">MG-101 DIGITAL RIG STUDIO</div>
        <div style="font-size:9.5px;color:var(--muted);">QuickTone™ Companion • TS/AC-HD Engine</div>
      </div>
      <div id="status" style="font-size:9px;font-weight:800;color:#fbbf24;text-align:right;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">READY</div>
    </div>

    <div class="patch-grid">
      <div class="patch-left">
        <div class="patch-box">
          <div id="pCode" class="patch-num">5B</div>
          <div id="pSub" class="patch-sub">BANK 5 • PATCH B</div>
        </div>
        <div class="step-row">
          <button id="prevP" type="button">&lt; PREV</button>
          <button id="nextP" type="button">NEXT &gt;</button>
        </div>
      </div>
      <div>
        <div id="banks" class="bank-mini"></div>
        <div id="slots" class="slot-mini"></div>
      </div>
    </div>

    <div class="row" style="margin-top:8px;">
      <input id="nameInp" maxlength="16" placeholder="Jack Clean" />
      <button id="setName" class="amber-btn" type="button">EDIT / SAVE</button>
    </div>
  </div>

  <!-- Hardware Round Buttons Row -->
  <div class="card" style="padding:8px;">
    <div class="grid7">
      <button id="btnGlobal" class="hw-btn" type="button"><span class="hw-led"></span>GLOBAL</button>
      <button id="btnEdit" class="hw-btn active" type="button"><span class="hw-led"></span>EDIT/<br>EXIT</button>
      <button id="btnSave" class="hw-btn" type="button"><span class="hw-led"></span>SAVE</button>
      <button id="btnMode" class="hw-btn" type="button"><span class="hw-led"></span>MODE</button>
      <button id="btnJam" class="hw-btn" type="button"><span class="hw-led"></span>JAM</button>
      <button id="btnTap" class="hw-btn" type="button"><span class="hw-led"></span>TAP</button>
      <button id="btnExp" class="hw-btn green-on" type="button"><span class="hw-led"></span>EXP</button>
    </div>
  </div>

  <!-- 10-Block Signal Chain -->
  <div class="card">
    <div class="sec-title">Signal Chain (10 Blocks)</div>
    <div id="chain" class="grid5"></div>
    <div class="grid2">
      <button id="mLeft" type="button">&lt; MOVE LEFT</button>
      <button id="mRight" type="button">MOVE RIGHT &gt;</button>
    </div>
  </div>

  <!-- Cream Rotary Knobs (SELECT, 1, 2, 3) + Visual Gear + Params -->
  <div class="card">
    <div class="row">
      <span id="edTitle" class="sec-title" style="margin:0;">AMP - GUITAR AMPS</span>
      <button id="pwrBtn" type="button">ACTIVE • ENABLED</button>
    </div>

    <div id="hwKnobs" class="grid4" style="margin-top:8px;"></div>
    <div id="visualGear" style="margin-top:6px;"></div>
    <div id="irExtras"></div>
    <div id="params" class="param-grid"></div>
  </div>

  <!-- Performance & Utilities (LOOP, DRUM, TUNER) -->
  <div class="card">
    <div class="sec-title">Performance &amp; Utilities</div>
    <div class="grid3">
      <div class="util-box">
        <div class="row"><span style="font-size:10px;font-weight:900;">LOOP</span><span id="loopState" style="font-size:9px;color:#ef4444;font-weight:800;">STOP</span></div>
        <div class="row" style="gap:4px;">
          <button id="loopRec" type="button" style="flex:1;padding:5px 2px;font-size:9px;">REC/PLAY</button>
          <button id="loopStop" type="button" style="padding:5px 6px;font-size:9px;">■</button>
        </div>
        <div class="row"><span style="font-size:9px;color:var(--muted);">LEVEL</span><span id="loopLvlVal" style="font-size:9.5px;color:#fbbf24;font-weight:800;">70%</span></div>
        <input id="loopLvl" type="range" min="0" max="100" value="70" style="width:100%;accent-color:#f59e0b;" />
      </div>

      <div class="util-box">
        <div class="row"><span style="font-size:10px;font-weight:900;">DRUM</span><button id="drumToggle" type="button" style="padding:2px 6px;font-size:9px;">▶/■</button></div>
        <select id="drumPat" style="font-size:9.5px;padding:4px;">
          <option value="0">Rock Beat 1</option>
          <option value="1">Metal Double</option>
          <option value="2">Blues Shuffle</option>
          <option value="3">Funk Groove</option>
          <option value="4">Metronome</option>
        </select>
        <div class="row"><span style="font-size:9px;color:var(--muted);">BPM</span><span id="bpmVal" style="font-size:9.5px;color:#fbbf24;font-weight:800;">120</span></div>
        <input id="drumBpm" type="range" min="40" max="240" value="120" style="width:100%;accent-color:#3b82f6;" />
      </div>

      <div class="util-box" style="text-align:center;">
        <div class="row"><span style="font-size:10px;font-weight:900;">TUNER</span><button id="tunerBtn" type="button" style="padding:2px 6px;font-size:9px;">BYPASS</button></div>
        <div id="tunerNote" style="font-size:22px;font-weight:900;color:#22c55e;line-height:1;">E</div>
        <div class="tuner-bar">
          <div class="tuner-led"></div><div class="tuner-led"></div><div class="tuner-led"></div><div class="tuner-led"></div>
          <div class="tuner-led mid"></div>
          <div class="tuner-led"></div><div class="tuner-led"></div><div class="tuner-led"></div><div class="tuner-led"></div>
        </div>
        <div style="font-size:8.5px;color:var(--muted);">440Hz STANDARD</div>
      </div>
    </div>
  </div>
</div>

function shadeHex(hex,amt){
  var c=(hex||"#37474f").replace("#","");
  if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var n=parseInt(c,16);
  var r=Math.max(0,Math.min(255,((n>>16)&255)+amt));
  var g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  var b=Math.max(0,Math.min(255,(n&255)+amt));
  return "rgb("+r+","+g+","+b+")";
}

var midiOut=null;
var NUX_BLK_IDX={NG:0,CMP:1,EFX:2,AMP:3,IR:4,EQ:5,MOD:6,DLY:7,RVB:8,"P.L":9};
var loopOn=false, drumOn=false, tunerOn=false, tapTimes=[];

function flatModels(id){
  var out=[], groups=GEAR[id]||[];
  for(var i=0;i<groups.length;i++) for(var j=0;j<groups[i].items.length;j++) out.push(groups[i].items[j].n);
  return out.length?out:["Default"];
}
function newPatch(code){
  var b={};
  for(var i=0;i<ORDER.length;i++){
    var id=ORDER[i], pr={};
    for(var j=0;j<META[id].p.length;j++) pr[META[id].p[j][1]]=META[id].p[j][2];
    var list=flatModels(id);
    b[id]={on:true,model:list[0],p:pr};
    if(id==="IR"){ b[id].model="User IR 04"; b[id].micOn=true; b[id].mic="SM57"; b[id].pos="Middle"; b[id].micLvl=75; }
  }
  return {name:(code==="5B"?"Jack Clean":"PATCH "+code),chain:ORDER.slice(),b:b};
}
function initState(){
  var patches={};
  for(var i=0;i<BANKS.length;i++) for(var j=0;j<SLOTS.length;j++){ var c=""+BANKS[i]+SLOTS[j]; patches[c]=newPatch(c); }
  return {bank:5,slot:"B",sel:"AMP",patches:patches};
}
var st=(function(){
  try{ var r=localStorage.getItem(KEY); if(r){ var o=JSON.parse(r); if(o&&o.patches&&o.patches["5B"]&&o.patches["5B"].b&&o.patches["5B"].b["P.L"]) return o; } }catch(e){}
  return initState();
})();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
function code(){ return ""+st.bank+st.slot; }
function patch(){
  var c=code();
  if(!st.patches[c]) st.patches[c]=newPatch(c);
  if(!META[st.sel]) st.sel="AMP";
  return st.patches[c];
}

function sendSysEx(bytes){
  if(!midiOut) return;
  try{
    var sum=0;
    for(var i=0;i<bytes.length;i++) sum=(sum+bytes[i])&0x7f;
    var chk=(128-sum)&0x7f;
    var msg=[0xf0,0x43,0x58,0x70,0x10].concat(bytes,[chk,0xf7]);
    midiOut.send(msg);
  }catch(e){}
}

function sendCC(cc,v){
  if(!midiOut) return;
  var val127=Math.max(0,Math.min(127,Math.round((v/100)*127)));
  try{
    // Broadcast on Ch 1 & Ch 2 + NUX QuickTone SysEx
    midiOut.send([0xb0,cc&0x7f,val127]);
    midiOut.send([0xb1,cc&0x7f,val127]);
    sendSysEx([0x04,0x01,cc&0x7f,val127]);
  }catch(e){}
}

function sendPC(pc){
  if(!midiOut) return;
  var idx=Math.max(0,Math.min(39,pc));
  try{
    midiOut.send([0xc0,idx]);
    midiOut.send([0xc1,idx]);
    sendSysEx([0x01,0x00,idx]);
  }catch(e){}
}

function sendName(n){
  var s=String(n||"PATCH");
  while(s.length<16) s+=" ";
  s=s.slice(0,16);
  var chars=[];
  for(var i=0;i<16;i++) chars.push(s.charCodeAt(i)&0x7f);
  var pcIdx=(st.bank-1)*4+SLOTS.indexOf(st.slot);
  sendSysEx([0x02,0x01,pcIdx&0x7f].concat(chars));
  sendSysEx([0x02,0x02,pcIdx&0x7f]);
  var stEl=document.getElementById("status");
  if(stEl) stEl.textContent="SAVED: "+s.trim()+" -> MG-101";
}

function sendChain(p){
  var orderBytes=[];
  for(var i=0;i<p.chain.length;i++){
    var bid=p.chain[i];
    var m=META[bid];
    var idx=(typeof NUX_BLK_IDX[bid]==="number")?NUX_BLK_IDX[bid]:i;
    orderBytes.push(idx&0x7f);
    if(m && midiOut) try{ midiOut.send([0xb0,m.cCc,i]); }catch(e){}
  }
  sendSysEx([0x03,0x01].concat(orderBytes));
  var stEl=document.getElementById("status");
  if(stEl) stEl.textContent="CHAIN: "+p.chain.slice(0,5).join(">")+"...";
}

function connectMidi(){
  var ms=document.getElementById("midiState");
  var mb=document.getElementById("midiBtn");
  if(!navigator.requestMIDIAccess){ if(ms) ms.textContent="MIDI: UNSUPPORTED"; return; }
  navigator.requestMIDIAccess({sysex:true}).then(function(acc){
    var outs=Array.from(acc.outputs.values());
    if(outs.length){
      var target=outs.find(function(o){
        var nm=(o.name||"").toLowerCase();
        return nm.indexOf("nux")!==-1 || nm.indexOf("mg")!==-1 || nm.indexOf("usb")!==-1;
      }) || outs[0];
      midiOut=target;
      if(ms) ms.textContent="OTG: "+(target.name||"MG-101").slice(0,16);
      if(mb) mb.classList.add("connected");
      sendChain(patch());
    }else if(ms) ms.textContent="MIDI: NO DEVICE";
  }).catch(function(){ if(ms) ms.textContent="MIDI: SYSEX BLOCKED"; });
  }

        var ni=(mIdx+1)%allNames.length;
        blk.model=allNames[ni];
        sendCC(m.cc+40,allNames.length>1?Math.round((ni/(allNames.length-1))*100):0);
        save(); draw(false);
      };
      hk.appendChild(selBox);

      for(var ki=0;ki<3;ki++){
        var pr=m.p[ki];
        var kBox=document.createElement("div"); kBox.className="knob-box";
        if(pr){
          var kCc=pr[1], kv=(typeof blk.p[kCc]==="number")?blk.p[kCc]:pr[2]; blk.p[kCc]=kv;
          var deg=-135+(kv/100)*270;
          var disp=(pr[0]==="Bright")?(kv>=50?"ON":"OFF"):kv;
          kBox.innerHTML="<div class='knob-dial'><div class='knob-ptr' style='transform:translateX(-50%) rotate("+deg+"deg);'></div></div><div class='knob-lbl'>"+pr[0]+"</div><div class='knob-val'>"+disp+"</div><div class='k-step'><button type='button' class='km'>-</button><button type='button' class='kp'>+</button></div>";
          (function(ccNum){
            kBox.querySelector(".km").onclick=function(){
              var nv=Math.max(0,(blk.p[ccNum]||0)-5);
              blk.p[ccNum]=nv; sendCC(ccNum,nv); save(); draw(false);
            };
            kBox.querySelector(".kp").onclick=function(){
              var nv=Math.min(100,(blk.p[ccNum]||0)+5);
              blk.p[ccNum]=nv; sendCC(ccNum,nv); save(); draw(false);
            };
          })(kCc);
        }else{
          kBox.innerHTML="<div class='knob-dial'><div class='knob-ptr' style='transform:translateX(-50%) rotate(0deg);'></div></div><div class='knob-lbl'>KNOB "+(ki+1)+"</div><div class='knob-val'>--</div>";
        }
        hk.appendChild(kBox);
      }
    }

    var vg=safeGet("visualGear");
    if(vg){
      vg.innerHTML="";
      var allNames2=flatModels(id);
      (GEAR[id]||[]).forEach(function(grp){
        var lbl=document.createElement("div"); lbl.className="grp-label"; lbl.textContent=grp.g; vg.appendChild(lbl);
        var grid=document.createElement("div"); grid.className="gear-grid";
        grp.items.forEach(function(it){
          var isAct=(blk.model===it.n);
          var card=document.createElement("button"); card.type="button";
          card.className="gear-card"+(isAct?" active":"");
          var cv=document.createElement("canvas"); cv.className="gear-canvas";
          try{ paintGearCanvas(cv,id,it,isAct); }catch(e){}
          var nm=document.createElement("div"); nm.className="gear-name"; nm.textContent=it.n;
          card.appendChild(cv); card.appendChild(nm);
          card.onclick=function(){
            blk.model=it.n;
            var idx=allNames2.indexOf(blk.model);
            var ccVal=allNames2.length>1?Math.round((idx/(allNames2.length-1))*100):0;
            sendCC(m.cc+40,ccVal); save(); draw(false);
          };
          grid.appendChild(card);
        });
        vg.appendChild(grid);
      });
    }

    var irBox=safeGet("irExtras");
    if(irBox){
      irBox.innerHTML="";
      if(id==="IR"){
        var micPanel=document.createElement("div"); micPanel.className="mic-panel";
        var headRow=document.createElement("div"); headRow.className="row";
        headRow.innerHTML="<span style='font-size:11px;font-weight:900;color:#e2e8f0;'>CAB MIC CONTROL (4 MICS &amp; 3 POSITIONS)</span>";
        var micToggle=document.createElement("button"); micToggle.type="button";
        micToggle.textContent=blk.micOn?"MIC ON":"MIC OFF"; micToggle.className=blk.micOn?"blue-btn":"";
        micToggle.onclick=function(){ blk.micOn=!blk.micOn; sendCC(55,blk.micOn?100:0); save(); draw(false); };
        headRow.appendChild(micToggle); micPanel.appendChild(headRow);

        var micGrid=document.createElement("div"); micGrid.className="grid4";
        IR_MICS.forEach(function(micName,idx){
          var isM=(blk.mic===micName);
          var b=document.createElement("button"); b.type="button";
          b.className="mic-card"+(isM?" active":"");
          var mcv=document.createElement("canvas"); mcv.className="mic-canvas";
          try{ paintMicCanvas(mcv,micName); }catch(e){}
          var mnm=document.createElement("div"); mnm.className="gear-name"; mnm.textContent=micName;
          b.appendChild(mcv); b.appendChild(mnm);
          b.onclick=function(){ blk.mic=micName; blk.micOn=true; sendCC(53,Math.round((idx/3)*100)); save(); draw(false); };
          micGrid.appendChild(b);
        });
        micPanel.appendChild(micGrid);

        var posGrid=document.createElement("div"); posGrid.className="grid3";
        IR_POS.forEach(function(posName,idx){
          var b=document.createElement("button"); b.type="button";
          if(blk.pos===posName) b.className="blue-btn";
          b.innerHTML="<span class='gear-name'>"+posName+"</span>";
          b.onclick=function(){ blk.pos=posName; blk.micOn=true; sendCC(54,Math.round((idx/2)*100)); save(); draw(false); };
          posGrid.appendChild(b);
        });
        micPanel.appendChild(posGrid);
        irBox.appendChild(micPanel);
      }
    }

    var pw=safeGet("params");
    if(pw){
      pw.innerHTML="";
      (m.p||[]).forEach(function(pr){
        var cc=pr[1], val=(typeof blk.p[cc]==="number")?blk.p[cc]:pr[2]; blk.p[cc]=val;
        var box=document.createElement("div"); box.className="param-box";
        box.innerHTML="<div class='row'><span style='font-size:11px;font-weight:700;'>"+pr[0]+"</span><div class='row' style='gap:4px;'><button type='button' class='p-mini-btn minus'>-</button><span class='val' style='min-width:28px;text-align:center;font-size:11px;color:#fbbf24;'>"+val+"</span><button type='button' class='p-mini-btn plus'>+</button></div></div><input type='range' min='0' max='100' value='"+val+"' style='width:100%;margin-top:5px;accent-color:#3b82f6;'>";
        var vEl=box.querySelector(".val"), rEl=box.querySelector("input[type=range]");
        function setV(nv){
          nv=Math.max(0,Math.min(100,Number(nv)));
          blk.p[cc]=nv; vEl.textContent=nv; rEl.value=nv; sendCC(cc,nv); save();
        }
        rEl.oninput=function(){ setV(rEl.value); };
        box.querySelector(".minus").onclick=function(){ setV(blk.p[cc]-1); };
        box.querySelector(".plus").onclick=function(){ setV(blk.p[cc]+1); };
        pw.appendChild(box);
      });
    }
  }catch(err){
    if(safeGet("status")) safeGet("status").textContent="ERR: "+(err && err.message ? err.message : err);
  }
}

function stepPatch(d){
  var list=[]; BANKS.forEach(function(b){ SLOTS.forEach(function(s){ list.push(""+b+s); }); });
  var i=list.indexOf(code()), nxt=list[(i+d+list.length)%list.length];
  st.bank=parseInt(nxt,10); st.slot=nxt.slice(-1);
  sendPC((st.bank-1)*4+SLOTS.indexOf(st.slot)); save(); draw(true);
}
function moveBlock(d){
  var p=patch(), i=p.chain.indexOf(st.sel), t=i+d;
  if(i<0||t<0||t>=p.chain.length) return;
  var tmp=p.chain[i]; p.chain[i]=p.chain[t]; p.chain[t]=tmp;
  sendChain(p); save(); draw(false);
}

safeGet("midiBtn").onclick=connectMidi;
safeGet("prevP").onclick=function(){ stepPatch(-1); };
safeGet("nextP").onclick=function(){ stepPatch(1); };
safeGet("setName").onclick=function(){
  var v=safeGet("nameInp").value.trim(); if(!v) return;
  var clean=v.slice(0,16); patch().name=clean; sendName(clean); save(); draw(true);
};
safeGet("btnSave").onclick=function(){ safeGet("setName").click(); };
safeGet("btnGlobal").onclick=function(){ sendSysEx([0x05,0x01]); safeGet("status").textContent="GLOBAL SETTINGS SYNCED"; };
safeGet("btnEdit").onclick=function(){ sendSysEx([0x05,0x02]); safeGet("status").textContent="EDIT / EXIT TOGGLED"; };
safeGet("btnMode").onclick=function(){ sendCC(80,100); safeGet("status").textContent="MODE SWITCHED"; };
safeGet("btnJam").onclick=function(){ sendCC(81,100); safeGet("status").textContent="JAM MODE ACTIVE"; };
safeGet("btnExp").onclick=function(){
  var b=safeGet("btnExp"); b.classList.toggle("green-on");
  sendCC(11,b.classList.contains("green-on")?100:0);
};
safeGet("btnTap").onclick=function(){
  var now=Date.now(); tapTimes.push(now);
  if(tapTimes.length>4) tapTimes.shift();
  if(tapTimes.length>=2){
    var avg=(tapTimes[tapTimes.length-1]-tapTimes[0])/(tapTimes.length-1);
    var bpm=Math.max(40,Math.min(240,Math.round(60000/avg)));
    safeGet("drumBpm").value=bpm; safeGet("bpmVal").textContent=bpm;
    sendCC(82,Math.round(((bpm-40)/200)*100));
  }
};
safeGet("loopRec").onclick=function(){
  loopOn=!loopOn; safeGet("loopState").textContent=loopOn?"PLAYING":"OVERDUB";
  sendCC(85,loopOn?100:50);
};
safeGet("loopStop").onclick=function(){ loopOn=false; safeGet("loopState").textContent="STOP"; sendCC(86,0); };
safeGet("loopLvl").oninput=function(){ var v=this.value; safeGet("loopLvlVal").textContent=v+"%"; sendCC(87,v); };
safeGet("drumToggle").onclick=function(){ drumOn=!drumOn; sendCC(88,drumOn?100:0); };
safeGet("drumPat").onchange=function(){ sendCC(89,this.value*20); };
safeGet("drumBpm").oninput=function(){ var v=this.value; safeGet("bpmVal").textContent=v; sendCC(82,Math.round(((v-40)/200)*100)); };
safeGet("tunerBtn").onclick=function(){
  tunerOn=!tunerOn; this.textContent=tunerOn?"ACTIVE":"BYPASS";
  if(tunerOn) this.className="amber-btn"; else this.className="";
  sendCC(90,tunerOn?100:0);
};
safeGet("mLeft").onclick=function(){ moveBlock(-1); };
safeGet("mRight").onclick=function(){ moveBlock(1); };

draw(true);
if(navigator.requestMIDIAccess){ connectMidi(); }
</script>
</body>
</html>
