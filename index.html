<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUX MG-101 Editor</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin: 15px 0; }
    button { background: #e63946; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; margin: 5px; }
    input[type=range] { width: 80%; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>🎸 NUX MG-101 Controller</h2>
  <button onclick="connectDevice()">Connect via OTG</button>
  <div id="status" class="card">Status: Disconnected</div>

  <div class="card">
    <h3>Patch Select</h3>
    <button onclick="changePatch(-1)">◀ Prev</button>
    <span id="patchNum" style="font-size: 20px; margin: 0 15px;">1A</span>
    <button onclick="changePatch(1)">Next ▶</button>
  </div>

  <div class="card">
    <h3>Amp Gain</h3>
    <input type="range" min="0" max="100" value="50" oninput="updateParam('Gain', this.value)">
    <h3>Reverb Level</h3>
    <input type="range" min="0" max="100" value="30" oninput="updateParam('Reverb', this.value)">
  </div>

  <script>
    let currentPatch = 1;
    function connectDevice() {
      document.getElementById('status').innerText = "USB MIDI Ready (OTG Connected)";
      document.getElementById('status').style.color = "#4ade80";
    }
    function changePatch(dir) {
      currentPatch = Math.max(1, Math.min(36, currentPatch + dir));
      document.getElementById('patchNum').innerText = "Patch " + currentPatch;
    }
    function updateParam(name, val) {
      document.getElementById('status').innerText = name + " set to " + val + "%";
    }
  </script>
</body>
</html>
