<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NUX MG-101 Digital Rig Studio</title>
  <style>
    :root{
      --bg:#080b10;--card:#121720;--card2:#19202c;--border:#2b3648;
      --text:#f1f5f9;--muted:#94a3b8;--amber:#f59e0b;--blue:#2563eb;--green:#22c55e;--red:#ef4444;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;padding:10px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
    .app{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
    .card{background:linear-gradient(180deg,#151b26 0%,#0f141d 100%);border:1px solid var(--border);border-radius:12px;padding:10px;overflow-x:hidden;box-shadow:0 10px 24px rgba(0,0,0,0.5);}
    .row{display:flex;gap:8px;align-items:center;justify-content:space-between;}
    .grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px;}
    .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px;}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px;}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;}
    button,input{font-family:inherit;color:var(--text);background:var(--card2);border:1px solid #303c52;border-radius:8px;padding:6px 8px;font-weight:700;cursor:pointer;min-width:0;}
    input{flex:1;background:#090d14;border-color:#2f3b50;font-weight:600;cursor:text;}
    .amber-btn{background:linear-gradient(180deg,#f59e0b 0%,#d97706 100%);border-color:#fbbf24;color:#090d14;font-weight:900;}
    .blue-btn{background:linear-gradient(180deg,#3b82f6 0%,#1d4ed8 100%);border-color:#60a5fa;color:#fff;}

    .top-bar{background:#0c1017;border:1px solid #232d3f;border-radius:10px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;font-weight:800;}
    .brand-mark{font-size:13px;font-weight:900;letter-spacing:0.6px;color:#f8fafc;}
    .brand-mark span{color:var(--amber);}
    .midi-pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:9.5px;font-weight:800;border:1px solid #334155;background:#121824;color:#e2e8f0;}
    .midi-dot{width:7px;height:7px;border-radius:50%;background:var(--red);}
    .midi-pill.connected .midi-dot{background:var(--green);box-shadow:0 0 8px var(--green);}

    .patch-grid{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:6px;}
    .patch-left{display:flex;flex-direction:column;align-items:center;gap:5px;}
    .patch-box{background:linear-gradient(180deg,#261d12 0%,#15110b 100%);border:1.5px solid var(--amber);border-radius:10px;padding:8px 14px;text-align:center;box-shadow:0 0 16px rgba(245,158,11,0.22);min-width:74px;}
    .patch-num{font-size:24px;font-weight:900;line-height:1.05;color:#fbbf24;}
    .patch-sub{font-size:8px;font-weight:800;color:#cbd5e1;letter-spacing:0.4px;margin-top:2px;}
    .step-row{display:flex;gap:4px;width:100%;}
    .step-row button{flex:1;padding:5px 4px;font-size:9.5px;}

    .bank-mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;}
    .bank-mini button{padding:4px 2px;font-size:9.5px;border-radius:5px;}
    .slot-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:5px;}
    .slot-mini button{padding:5px 2px;font-size:10px;border-radius:6px;}

    .sec-title{font-size:11px;font-weight:900;color:#e2e8f0;text-transform:uppercase;letter-spacing:0.65px;margin-bottom:6px;}
    .grp-label{font-size:11px;font-weight:800;color:#f59e0b;margin:10px 0 6px 0;border-left:3px solid var(--amber);padding-left:7px;}

    .chain-blk{background:linear-gradient(180deg,#1c2331 0%,#111620 100%);border:1px solid #2b3648;border-radius:8px;padding:6px 4px;text-align:center;min-width:0;}
    .chain-blk.sel{outline:2px solid var(--amber);border-color:var(--amber);background:linear-gradient(180deg,#2a2419 0%,#161410 100%);box-shadow:0 0 14px rgba(245,158,11,0.3);}
    .chain-dot{display:block;width:6px;height:6px;border-radius:50%;margin:0 auto 3px auto;background:#475569;}
    .chain-blk.on .chain-dot{background:var(--green);box-shadow:0 0 7px var(--green);}
    .blk-code{display:block;font-size:10.5px;font-weight:900;color:#fff;}
    .blk-model{display:block;font-size:8px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}

    .gear-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
    .gear-card{background:linear-gradient(180deg,#181f2c 0%,#0f141d 100%);border:1px solid #293446;border-radius:9px;padding:5px 4px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;}
    .gear-card.active{border-color:var(--amber);outline:2px solid var(--amber);background:linear-gradient(180deg,#262118 0%,#14120e 100%);box-shadow:0 0 14px rgba(245,158,11,0.32);}
    .gear-canvas{width:100%;height:70px;border-radius:6px;display:block;background:#080b10;}
    .gear-name{font-size:9.5px;font-weight:800;line-height:1.15;color:#f1f5f9;word-break:break-word;}

    .mic-panel{background:#0e131b;border:1px solid #283345;border-radius:10px;padding:9px;margin-top:10px;}
    .mic-card{position:relative;background:linear-gradient(180deg,#171e2b 0%,#0e131c 100%);border:1px solid #293446;border-radius:9px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
    .mic-card.active{border-color:var(--amber);outline:2px solid var(--amber);background:#211d15;}
    .mic-badge{position:absolute;top:-6px;right:4px;background:var(--amber);color:#090d14;font-size:8px;font-weight:900;padding:1px 5px;border-radius:5px;}
    .mic-canvas{width:46px;height:46px;display:block;}
    .param-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px;}
    .param-box{background:#0d121a;border:1px solid #253042;border-radius:8px;padding:7px 8px;}
    .p-mini-btn{padding:2px 7px;font-size:12px;border-radius:5px;}
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="brand-mark">N<span>U</span>X MG-101 • M-VAVE STUDIO</div>
    <button id="midiBtn" class="midi-pill" type="button">
      <span class="midi-dot"></span>
      <span id="midiState">MIDI: OTG • 44.1kHz</span>
    </button>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:4px;">
      <div>
        <div style="font-size:13px;font-weight:900;letter-spacing:0.3px;">MG-101 DIGITAL RIG STUDIO</div>
        <div style="font-size:9.5px;color:var(--muted);">QuickTone™ • Cube Suite Engine v2.5</div>
      </div>
      <div id="status" style="font-size:9.5px;font-weight:800;color:#fbbf24;text-align:right;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">SELECTED: IR - USER IR 04</div>
    </div>

    <div class="patch-grid">
      <div class="patch-left">
        <div class="patch-box">
          <div id="pCode" class="patch-num">2A</div>
          <div id="pSub" class="patch-sub">BANK 2 • PATCH A</div>
        </div>
        <div class="step-row">
          <button id="prevP" type="button">&lt; PREV</button>
          <button id="nextP" type="button">NEXT &gt;</button>
        </div>
      </div>
      <div>
        <div id="banks" class="bank-mini"></div>
        <div id="slots" class="slot-mini"></div>
      </div>
    </div>

    <div class="row" style="margin-top:8px;">
      <input id="nameInp" maxlength="16" placeholder="PATCH 2A - HIGH GAIN LEAD" />
      <button id="setName" class="amber-btn" type="button">EDIT/SAVE</button>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">Signal Chain (10 Blocks)</div>
    <div id="chain" class="grid5"></div>
    <div class="grid2">
      <button id="mLeft" type="button">&lt; MOVE LEFT</button>
      <button id="mRight" type="button">MOVE RIGHT &gt;</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span id="edTitle" class="sec-title" style="margin:0;">IR - EXTENSION CABS / IMPULSE RESPONSES</span>
      <button id="pwrBtn" type="button">ACTIVE • ENABLED</button>
    </div>
    <div id="visualGear" style="margin-top:6px;"></div>
    <div id="irExtras"></div>
    <div id="params" class="param-grid"></div>
  </div>
</div>

function shadeHex(hex,amt){
  var c=(hex||"#37474f").replace("#","");
  if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var n=parseInt(c,16);
  var r=Math.max(0,Math.min(255,((n>>16)&255)+amt));
  var g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  var b=Math.max(0,Math.min(255,(n&255)+amt));
  return "rgb("+r+","+g+","+b+")";
}

function drawCorners(ctx,x,y,w,h,col){
  ctx.fillStyle=col||"#cbd5e1";
  var s=7;
  ctx.fillRect(x,y,s,s); ctx.fillRect(x+w-s,y,s,s);
  ctx.fillRect(x,y+h-s,s,s); ctx.fillRect(x+w-s,y+h-s,s,s);
}

function drawSpeaker(ctx,x,y,r,ringCol){
  var outer=ctx.createRadialGradient(x-r*0.25,y-r*0.25,r*0.1,x,y,r);
  outer.addColorStop(0,"#475569");outer.addColorStop(0.45,"#1a2230");outer.addColorStop(0.84,"#06090e");outer.addColorStop(1,"#2b3648");
  ctx.fillStyle=outer;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=ringCol||"rgba(255,255,255,0.22)";ctx.lineWidth=1.2;ctx.stroke();

  var cone=ctx.createRadialGradient(x,y,r*0.32,x,y,r*0.85);
  cone.addColorStop(0,"#090c11");cone.addColorStop(0.7,"#18202c");cone.addColorStop(1,"#05070a");
  ctx.fillStyle=cone;ctx.beginPath();ctx.arc(x,y,r*0.82,0,Math.PI*2);ctx.fill();

  var cap=ctx.createRadialGradient(x-r*0.12,y-r*0.12,r*0.04,x,y,r*0.36);
  cap.addColorStop(0,"#94a3b8");cap.addColorStop(0.55,"#1e293b");cap.addColorStop(1,"#090d14");
  ctx.fillStyle=cap;ctx.beginPath();ctx.arc(x,y,r*0.35,0,Math.PI*2);ctx.fill();
}

function paintGearCanvas(cv,id,it,isActive){
  var w=cv.width=192, h=cv.height=140, ctx=cv.getContext("2d");
  ctx.clearRect(0,0,w,h);

  if(id==="AMP"){
    if(it.kind==="stack"){
      var headCol="#161d29", faceCol="#94a3b8", grille="#0c111a";
      if(it.skin==="rect"){ faceCol="#cbd5e1"; grille="#1e2530"; }
      else if(it.skin==="jcm"||it.skin==="plexi"){ faceCol="#f59e0b"; }
      else if(it.skin==="slo"){ headCol="#e2e8f0"; faceCol="#1e293b"; }
      else if(it.skin==="vh4"){ faceCol="#f8fafc"; }

      ctx.fillStyle=headCol; ctx.fillRect(24,6,144,36);
      ctx.strokeStyle="#04070c"; ctx.lineWidth=2.5; ctx.strokeRect(24,6,144,36);
      ctx.fillStyle=faceCol; ctx.fillRect(30,20,132,17);
      if(it.skin==="rect"){
        ctx.fillStyle="#64748b";
        for(var rx=34;rx<156;rx+=9){ ctx.fillRect(rx,10,4.5,3.5); ctx.fillRect(rx+3.5,14.5,4.5,3.5); }
      }else{ ctx.fillStyle=grille; ctx.fillRect(30,9,132,9); }

      for(var kx=42;kx<=142;kx+=14){
        ctx.fillStyle="#090d14"; ctx.beginPath(); ctx.arc(kx,28.5,4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="#e2e8f0"; ctx.lineWidth=1; ctx.stroke();
      }
      ctx.fillStyle="#ff1744"; ctx.beginPath(); ctx.arc(153,28.5,3.2,0,Math.PI*2); ctx.fill();

      ctx.fillStyle="#121824"; ctx.fillRect(18,45,156,88);
      ctx.strokeStyle="#cbd5e1"; ctx.lineWidth=1.4; ctx.strokeRect(22,49,148,80);
      ctx.fillStyle="#080c14"; ctx.fillRect(24,51,144,76);
      drawSpeaker(ctx,60,71,16); drawSpeaker(ctx,132,71,16);
      drawSpeaker(ctx,60,107,16); drawSpeaker(ctx,132,107,16);
      drawCorners(ctx,18,45,156,88,"#cbd5e1");
      ctx.fillStyle="#1e293b"; ctx.fillRect(76,84,40,10);
      ctx.strokeStyle="#e2e8f0"; ctx.lineWidth=0.9; ctx.strokeRect(76,84,40,10);
    }else{
      var body="#1a2230", grill="#101622", panel="#cbd5e1", pipe="#94a3b8";
      if(it.skin==="tweed"){ body="#cfa257"; grill="#5a3e1e"; panel="#e2e8f0"; pipe="#785327"; }

var midiOut=null;
var NUX_BLK_IDX={GATE:0,CMP:1,EFX:2,AMP:3,IR:4,EQ:5,MOD:6,DLY:7,RVB:8,"P.L":9};
var NUX_AMP_KNOB_CC={45:[45,14,74],46:[46,15,7],47:[47,16,71],48:[48,17,75],49:[49,18,76]};

function flatModels(id){
  var out=[], groups=GEAR[id]||[];
  for(var i=0;i<groups.length;i++) for(var j=0;j<groups[i].items.length;j++) out.push(groups[i].items[j].n);
  return out.length?out:["Default"];
}
function newPatch(code){
  var b={};
  for(var i=0;i<ORDER.length;i++){
    var id=ORDER[i], pr={};
    for(var j=0;j<META[id].p.length;j++) pr[META[id].p[j][1]]=META[id].p[j][2];
    var list=flatModels(id);
    b[id]={on:(id!=="EQ"&&id!=="MOD"),model:list[0],p:pr};
    if(id==="IR"){ b[id].model="User IR 04"; b[id].micOn=true; b[id].mic="SM57"; b[id].pos="Middle"; b[id].micLvl=75; }
  }
  return {name:"PATCH "+code+" - HIGH GAIN LEAD",chain:ORDER.slice(),b:b};
}
function initState(){
  var patches={};
  for(var i=0;i<BANKS.length;i++) for(var j=0;j<SLOTS.length;j++){ var c=""+BANKS[i]+SLOTS[j]; patches[c]=newPatch(c); }
  return {bank:2,slot:"A",sel:"IR",patches:patches};
}
var st=(function(){
  try{ var r=localStorage.getItem(KEY); if(r){ var o=JSON.parse(r); if(o&&o.patches&&o.patches["2A"]&&o.patches["2A"].b&&o.patches["2A"].b["P.L"]) return o; } }catch(e){}
  return initState();
})();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
function code(){ return ""+st.bank+st.slot; }
function patch(){
  var c=code();
  if(!st.patches[c]) st.patches[c]=newPatch(c);
  if(!META[st.sel]) st.sel="IR";
  if(st.patches[c].b && st.patches[c].b.IR){
    if(typeof st.patches[c].b.IR.micOn!=="boolean") st.patches[c].b.IR.micOn=true;
    if(!st.patches[c].b.IR.mic) st.patches[c].b.IR.mic="SM57";
    if(!st.patches[c].b.IR.pos) st.patches[c].b.IR.pos="Middle";
    if(typeof st.patches[c].b.IR.micLvl!=="number") st.patches[c].b.IR.micLvl=75;
  }
  return st.patches[c];
}

function sendSysEx(bytes){
  if(!midiOut) return;
  try{
    var sum=0;
    for(var i=0;i<bytes.length;i++) sum=(sum+bytes[i])&0x7f;
    var chk=(128-sum)&0x7f;
    var msg=[0xf0,0x43,0x58,0x70,0x10].concat(bytes,[chk,0xf7]);
    midiOut.send(msg);
  }catch(e){}
}

function sendCC(cc,v){
  if(!midiOut) return;
  var val127=Math.max(0,Math.min(127,Math.round((v/100)*127)));
  try{
    midiOut.send([0xb0,cc,val127]);
    if(NUX_AMP_KNOB_CC[cc]){
      var alts=NUX_AMP_KNOB_CC[cc];
      for(var k=1;k<alts.length;k++) midiOut.send([0xb0,alts[k],val127]);
      sendSysEx([0x04,0x03,cc&0x7f,val127]);
    }else{
      sendSysEx([0x04,0x01,cc&0x7f,val127]);
    }
  }catch(e){}
}

function sendPC(pc){
  if(!midiOut) return;
  var idx=Math.max(0,Math.min(39,pc));
  try{
    midiOut.send([0xc0,idx]);
    sendSysEx([0x01,0x00,idx]);
  }catch(e){}
}

function sendName(n){
  if(!midiOut) return;
  var s=String(n||"PATCH").toUpperCase();
  while(s.length<16) s+=" ";
  s=s.slice(0,16);
  var chars=[];
  for(var i=0;i<16;i++) chars.push(s.charCodeAt(i)&0x7f);
  var pcIdx=(st.bank-1)*4+SLOTS.indexOf(st.slot);
  sendSysEx([0x02,0x01,pcIdx&0x7f].concat(chars));
  sendSysEx([0x02,0x02,pcIdx&0x7f]);
  var stEl=document.getElementById("status");
  if(stEl) stEl.textContent="SENT NAME: "+s.trim()+" -> MG-101";
}

function sendChain(p){
  if(!midiOut) return;
  var orderBytes=[];
  for(var i=0;i<p.chain.length;i++){
    var bid=p.chain[i];
    var m=META[bid];
    var idx=(typeof NUX_BLK_IDX[bid]==="number")?NUX_BLK_IDX[bid]:i;
    orderBytes.push(idx&0x7f);
    if(m) try{ midiOut.send([0xb0,m.cCc,i]); }catch(e){}
  }
  sendSysEx([0x03,0x01].concat(orderBytes));
  var stEl=document.getElementById("status");
  if(stEl) stEl.textContent="CHAIN SYNCED: "+p.chain.slice(0,5).join(">")+"...";
}

function connectMidi(){
  var ms=document.getElementById("midiState");
  var mb=document.getElementById("midiBtn");
  if(!navigator.requestMIDIAccess){ if(ms) ms.textContent="MIDI: UNSUPPORTED"; return; }
  navigator.requestMIDIAccess({sysex:true}).then(function(acc){
    var outs=Array.from(acc.outputs.values());
    if(outs.length){
      var target=outs.find(function(o){
        var nm=(o.name||"").toLowerCase();
        return nm.indexOf("nux")!==-1 || nm.indexOf("mg")!==-1 || nm.indexOf("usb")!==-1;
      }) || outs[0];
      midiOut=target;
      if(ms) ms.textContent="OTG: "+(target.name||"MG-101").slice(0,16);
      if(mb) mb.classList.add("connected");
      sendChain(patch());
    }else if(ms) ms.textContent="MIDI: NO DEVICE";
  }).catch(function(){ if(ms) ms.textContent="MIDI: SYSEX BLOCKED"; });
  }

          var b=document.createElement("button"); b.type="button";
          if(blk.pos===posName) b.className="blue-btn";
          b.innerHTML="<span class='gear-name'>"+posName+"</span>";
          b.onclick=function(){ blk.pos=posName; blk.micOn=true; sendCC(54,Math.round((idx/2)*127)); save(); draw(false); };
          posGrid.appendChild(b);
        });
        micPanel.appendChild(posGrid);

        var lvlBox=document.createElement("div"); lvlBox.className="param-box"; lvlBox.style.marginTop="8px";
        lvlBox.innerHTML="<div class='row'><span style='font-size:11px;font-weight:700;'>Mic Level</span><div class='row' style='gap:4px;'><button type='button' class='p-mini-btn mminus'>-</button><span class='mval' style='min-width:30px;text-align:center;font-size:11px;color:#fbbf24;'>"+blk.micLvl+"%</span><button type='button' class='p-mini-btn mplus'>+</button></div></div><input type='range' min='0' max='100' value='"+blk.micLvl+"' style='width:100%;margin-top:5px;accent-color:#3b82f6;'>";
        var mvEl=lvlBox.querySelector(".mval"), mrEl=lvlBox.querySelector("input[type=range]");
        function setMicLvl(nv){
          nv=Math.max(0,Math.min(100,Number(nv)));
          blk.micLvl=nv; mvEl.textContent=nv+"%"; mrEl.value=nv; sendCC(56,nv); save();
        }
        mrEl.oninput=function(){ setMicLvl(mrEl.value); };
        lvlBox.querySelector(".mminus").onclick=function(){ setMicLvl(blk.micLvl-1); };
        lvlBox.querySelector(".mplus").onclick=function(){ setMicLvl(blk.micLvl+1); };
        micPanel.appendChild(lvlBox);
        irBox.appendChild(micPanel);
      }
    }

    var pw=safeGet("params");
    if(pw){
      pw.innerHTML="";
      (m.p||[]).forEach(function(pr){
        var cc=pr[1], val=(typeof blk.p[cc]==="number")?blk.p[cc]:pr[2]; blk.p[cc]=val;
        var box=document.createElement("div"); box.className="param-box";
        box.innerHTML="<div class='row'><span style='font-size:11px;font-weight:700;'>"+pr[0]+"</span><div class='row' style='gap:4px;'><button type='button' class='p-mini-btn minus'>-</button><span class='val' style='min-width:28px;text-align:center;font-size:11px;color:#fbbf24;'>"+val+"</span><button type='button' class='p-mini-btn plus'>+</button></div></div><input type='range' min='0' max='100' value='"+val+"' style='width:100%;margin-top:5px;accent-color:#3b82f6;'>";
        var vEl=box.querySelector(".val"), rEl=box.querySelector("input[type=range]");
        function setV(nv){
          nv=Math.max(0,Math.min(100,Number(nv)));
          blk.p[cc]=nv; vEl.textContent=nv; rEl.value=nv; sendCC(cc,nv); save();
        }
        rEl.oninput=function(){ setV(rEl.value); };
        box.querySelector(".minus").onclick=function(){ setV(blk.p[cc]-1); };
        box.querySelector(".plus").onclick=function(){ setV(blk.p[cc]+1); };
        pw.appendChild(box);
      });
    }
  }catch(err){
    if(safeGet("status")) safeGet("status").textContent="UI ERR: "+(err && err.message ? err.message : err);
  }
}

function stepPatch(d){
  var list=[]; BANKS.forEach(function(b){ SLOTS.forEach(function(s){ list.push(""+b+s); }); });
  var i=list.indexOf(code()), nxt=list[(i+d+list.length)%list.length];
  st.bank=parseInt(nxt,10); st.slot=nxt.slice(-1);
  sendPC((st.bank-1)*4+SLOTS.indexOf(st.slot)); save(); draw(true);
}
function moveBlock(d){
  var p=patch(), i=p.chain.indexOf(st.sel), t=i+d;
  if(i<0||t<0||t>=p.chain.length) return;
  var tmp=p.chain[i]; p.chain[i]=p.chain[t]; p.chain[t]=tmp;
  sendChain(p); save(); draw(false);
}

safeGet("midiBtn").onclick=connectMidi;
safeGet("prevP").onclick=function(){ stepPatch(-1); };
safeGet("nextP").onclick=function(){ stepPatch(1); };
safeGet("setName").onclick=function(){
  var v=safeGet("nameInp").value.trim(); if(!v) return;
  var clean=v.slice(0,16); patch().name=clean; sendName(clean); save(); draw(true);
};
safeGet("mLeft").onclick=function(){ moveBlock(-1); };
safeGet("mRight").onclick=function(){ moveBlock(1); };
draw(true);
if(navigator.requestMIDIAccess){ connectMidi(); }
</script>
</body>
</html>
