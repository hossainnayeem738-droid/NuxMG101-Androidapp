<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NUX MG-101 Digital Rig & Studio Gear</title>
  <style>
    :root{
      --bg:#0b0e12;--card:#14181f;--card2:#1b2029;--border:#2b3340;
      --text:#eef2f6;--muted:#97a3b4;--blue:#1e88e5;--amber:#ffb300;--green:#4caf50;--red:#d32f2f;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;padding:12px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
    .app{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;overflow-x:hidden;}
    .row{display:flex;gap:8px;align-items:center;justify-content:space-between;}
    .grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px;}
    .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px;}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;}
    button,input{font-family:inherit;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 8px;font-weight:700;cursor:pointer;min-width:0;}
    input{flex:1;background:#0f1318;border-color:var(--amber);font-weight:400;cursor:text;}
    .blue{background:var(--blue);border-color:var(--blue);color:#fff;}
    .red{background:var(--red);border-color:var(--red);color:#fff;}
    .st{background:#0f2133;border:1px solid #1f486e;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;}
    .sec-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;}
    .grp-label{font-size:11px;font-weight:800;color:#7fb3ff;margin:12px 0 6px 0;border-left:3px solid var(--blue);padding-left:6px;}

    /* Digital Signal Chain Blocks */
    .chain-blk{
      background:linear-gradient(180deg,#1c222d 0%,#12161d 100%);
      border:1px solid #2d3748;border-radius:11px;padding:6px 4px;
      display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;
    }
    .chain-blk.on{border-color:var(--green);box-shadow:0 0 8px rgba(76,175,80,0.15);}
    .chain-blk.sel{outline:2px solid var(--amber);border-color:var(--amber);background:linear-gradient(180deg,#252d3b 0%,#151a24 100%);}
    .led-strip{width:60%;height:3px;border-radius:999px;background:#3a424e;}
    .chain-blk.on .led-strip{background:#4caf50;box-shadow:0 0 6px #4caf50;}
    .blk-screen{
      width:100%;background:#090d12;border:1px solid rgba(255,255,255,0.08);
      border-radius:6px;padding:3px 2px;text-align:center;
    }
    .blk-code{display:block;font-size:10px;font-weight:900;letter-spacing:0.4px;color:#fff;}
    .blk-model{display:block;font-size:8px;color:#9fb1c7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}

    /* Digital Gear Cards */
    .gear-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
    .gear-card{
      background:#161a22;border:1px solid #28303d;border-radius:10px;padding:6px 4px;
      display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;
    }
    .gear-card.active{border-color:var(--amber);outline:2px solid var(--amber);background:#1e2531;box-shadow:0 0 10px rgba(255,179,0,0.2);}
    .gear-art{
      width:100%;height:52px;border-radius:6px;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
    }
    .gear-name{font-size:10px;font-weight:800;line-height:1.15;color:#eef2f6;word-break:break-word;margin-top:2px;}

    /* Mic & Position Controls */
    .mic-panel{background:#181d26;border:1px solid #2e3848;border-radius:12px;padding:10px;margin-top:10px;}
    .mic-card{
      background:#13171e;border:1px solid #2b3444;border-radius:10px;
      padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;
    }
    .mic-card.active{
      border-color:var(--amber);outline:2px solid var(--amber);
      background:#222a38;box-shadow:0 0 10px rgba(255,179,0,0.25);
    }
    .mic-art{width:36px;height:36px;display:flex;align-items:center;justify-content:center;}
    .pos-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;}
    .pos-art{width:38px;height:18px;}
  </style>
</head>
<body>
<div class="app">
  <div class="card row">
    <div>
      <div style="font-size:15px;font-weight:900;">NUX MG-101 DIGITAL RIG STUDIO</div>
      <div style="font-size:11px;color:var(--muted);">Guitar Rig &amp; Studio Gear Collection Controller</div>
    </div>
    <button id="midiBtn" class="red">Connect OTG</button>
  </div>

  <div class="st">
    <span id="status">READY</span>
    <span id="midiState">MIDI: OFF</span>
  </div>

  <div class="card">
    <div class="row">
      <button id="prevP">◀ Prev</button>
      <div style="text-align:center;">
        <div id="pCode" style="font-size:18px;font-weight:900;color:#64b5f6;">2A</div>
        <div id="pName" style="font-size:11px;color:var(--muted);">Patch 2A</div>
      </div>
      <button id="nextP">Next ▶</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <input id="nameInp" maxlength="16" placeholder="Patch Name" />
      <button id="setName" class="blue">Set Name</button>
    </div>
    <div id="banks" class="grid5"></div>
    <div id="slots" class="grid4"></div>
  </div>

  <div class="card">
    <div class="sec-title">Signal Chain (10 Blocks)</div>
    <div id="chain" class="grid5"></div>
    <div class="grid2">
      <button id="mLeft">◀ Move Left</button>
      <button id="mRight">Move Right ▶</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span id="edTitle" class="sec-title" style="margin:0;">AMP</span>
      <button id="pwrBtn">ACTIVE</button>
    </div>
    <div id="visualGear" style="margin-top:8px;"></div>
    <div id="irExtras"></div>
    <div id="params" style="margin-top:10px;"></div>
  </div>
</div>

function getPedalSVG(name,color,tag){
  return `<svg viewBox="0 0 80 52" width="100%" height="100%"><rect x="12" y="2" width="56" height="48" rx="6" fill="${color}" stroke="#0a0c0e" stroke-width="1.5"/><circle cx="22" cy="8" r="2.5" fill="#333"/><circle cx="34" cy="8" r="2.5" fill="#333"/><circle cx="46" cy="8" r="2.5" fill="#333"/><circle cx="58" cy="8" r="2.5" fill="#333"/><circle cx="40" cy="16" r="2" fill="#ff1744" stroke="#fff" stroke-width="0.5"/><rect x="16" y="22" width="48" height="12" fill="#0d0f12" rx="2"/><text x="40" y="30" font-family="sans-serif" font-weight="900" font-size="6.5" fill="#fff" text-anchor="middle">${tag}</text><circle cx="40" cy="42" r="4" fill="#cfd8dc" stroke="#546e7a" stroke-width="1.5"/></svg>`;
}

var GEAR={

  CMP:[{g:"Compression Pedals",items:[{n:"ROSE COMPRESSOR",c:"#ad1457",tag:"COMP"},{n:"4 COMP",c:"#455a64",tag:"4-COMP"}]}],
  EFX:[{g:"Drive & Distortion (EFX)",items:[
    {n:"DISTORTION+",c:"#ffb300",tag:"DIST+"},{n:"RE BOOST",c:"#78909c",tag:"BOOST"},{n:"AC BOOST",c:"#fbc02d",tag:"AC-BST"},
    {n:"DIST 803",c:"#e65100",tag:"OD-803"},{n:"T SCREAM",c:"#2e7d32",tag:"TS-OD"},{n:"BLUES DRV",c:"#1565c0",tag:"BLUES"},
    {n:"MORNING DRV",c:"#c0ca33",tag:"MORN"},{n:"RAT DIST",c:"#212121",tag:"RAT"},{n:"RED DIRT",c:"#c62828",tag:"DIRT"},
    {n:"CRUNCH",c:"#8e24aa",tag:"CRNCH"},{n:"MUFF FUZZ",c:"#4e342e",tag:"FUZZ"},{n:"KATANA",c:"#546e7a",tag:"CLEAN"},
    {n:"ST SINGER",c:"#00838f",tag:"SINGER"}
  ]}],
  AMP:[
    {g:"Combo Amps & Open-Back Cabinets",items:[
      {n:"TWEED 410",kind:"combo",tag:"4x10"},{n:"BRIT 212",kind:"combo",tag:"2x12"},{n:"EVL 112",kind:"combo",tag:"1x12"},
      {n:"CALI 112",kind:"combo",tag:"1x12"},{n:"BLUE 112",kind:"combo",tag:"1x12"},{n:"BLUE 212",kind:"combo",tag:"2x12"},
      {n:"DC 212",kind:"combo",tag:"2x12"},{n:"SUPER 212",kind:"combo",tag:"2x12"},{n:"TWEED 112",kind:"combo",tag:"1x12"},

    ]},
    {g:"Amplifier Heads & 4x12 Cabinets (Stack Rig)",items:[
      {n:"DIE VH4",kind:"stack",tag:"STACK"},{n:"DUAL RECT",kind:"stack",tag:"RECT"},{n:"FIREMAN HBE",kind:"stack",tag:"HBE"},
      {n:"HIWIRE",kind:"stack",tag:"HIWRE"},{n:"1987 X 50",kind:"stack",tag:"50W"},{n:"MR.Z 38",kind:"stack",tag:"38W"},

  ]}],

};

var midiOut=null;
function flatModels(id){
  var out=[], groups=GEAR[id]||[];
  for(var i=0;i<groups.length;i++) for(var j=0;j<groups[i].items.length;j++) out.push(groups[i].items[j].n);
  return out.length?out:["Default"];
}
function newPatch(code){
  var b={};
  for(var i=0;i<ORDER.length;i++){
    var id=ORDER[i], pr={};
    for(var j=0;j<META[id].p.length;j++) pr[META[id].p[j][1]]=META[id].p[j][2];
    var list=flatModels(id);
    b[id]={on:(id!=="EQ"&&id!=="MOD"),model:list[0],p:pr};
    if(id==="IR"){ b[id].micOn=true; b[id].mic=IR_MICS[1]; b[id].pos=IR_POS[0]; b[id].micLvl=75; }
  }
  return {name:"Patch "+code,chain:ORDER.slice(),b:b};
}
function initState(){
  var patches={};
  for(var i=0;i<BANKS.length;i++) for(var j=0;j<SLOTS.length;j++){ var c=""+BANKS[i]+SLOTS[j]; patches[c]=newPatch(c); }
  return {bank:2,slot:"A",sel:"IR",patches:patches};
}
var st=(function(){
  try{ var r=localStorage.getItem(KEY); if(r){ var o=JSON.parse(r); if(o&&o.patches&&o.patches["2A"]&&o.patches["2A"].b&&o.patches["2A"].b["P.L"]) return o; } }catch(e){}
  return initState();
})();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
function code(){ return ""+st.bank+st.slot; }
function patch(){
  var c=code();
  if(!st.patches[c]) st.patches[c]=newPatch(c);
  if(!META[st.sel]) st.sel="IR";
  if(st.patches[c].b && st.patches[c].b.IR){
    if(typeof st.patches[c].b.IR.micOn!=="boolean") st.patches[c].b.IR.micOn=true;
    if(!st.patches[c].b.IR.mic) st.patches[c].b.IR.mic=IR_MICS[1];
    if(!st.patches[c].b.IR.pos) st.patches[c].b.IR.pos=IR_POS[0];
    if(typeof st.patches[c].b.IR.micLvl!=="number") st.patches[c].b.IR.micLvl=75;
  }
  return st.patches[c];
}
function sendCC(cc,v){ if(!midiOut) return; try{ midiOut.send([0xb0,cc,Math.max(0,Math.min(127,Math.round(v)))]); }catch(e){} }
function sendPC(pc){ if(!midiOut) return; try{ midiOut.send([0xc0,Math.max(0,Math.min(127,pc))]); }catch(e){} }
function sendName(n){
  if(!midiOut) return;
  try{
    var arr=[0xf0,0x43,0x01], s=String(n||"").slice(0,16);
    for(var i=0;i<s.length;i++) arr.push(s.charCodeAt(i)&0x7f);
    arr.push(0xf7); midiOut.send(arr);
  }catch(e){}
}
function sendChain(p){
  for(var i=0;i<p.chain.length;i++){ var m=META[p.chain[i]]; if(m) sendCC(m.cCc,i); }
}
function connectMidi(){
  var ms=document.getElementById("midiState");
  if(!navigator.requestMIDIAccess){ ms.textContent="MIDI: UNSUPPORTED"; return; }
  navigator.requestMIDIAccess({sysex:true}).then(function(acc){
    var outs=Array.from(acc.outputs.values());
    if(outs.length){
      midiOut=outs[0]; ms.textContent="MIDI: "+(midiOut.name||"OK");
      var b=document.getElementById("midiBtn"); b.textContent="OTG Connected"; b.className="blue";
      sendChain(patch());
    }else ms.textContent="MIDI: NO DEVICE";
  }).catch(function(){ ms.textContent="MIDI: BLOCKED"; });
}
// PART 1 END
  function draw(syncInp){
  var p=patch(), c=code(), id=st.sel, m=META[id], blk=p.b[id];
  document.getElementById("pCode").textContent=c;
  document.getElementById("pName").textContent=p.name;
  var inp=document.getElementById("nameInp");
  if(syncInp||document.activeElement!==inp) inp.value=p.name;
  var micInfo=id==="IR"?(" ["+(blk.micOn?(blk.mic+" / "+blk.pos+" / Mic "+blk.micLvl):"MIC OFF")+"]"):"";
  document.getElementById("status").textContent="SELECTED: "+id+" ("+m.n+") - "+blk.model+micInfo;
  document.getElementById("edTitle").textContent=id+" - "+m.n.toUpperCase();

  var bg=document.getElementById("banks"); bg.innerHTML="";
  BANKS.forEach(function(b){
    var btn=document.createElement("button");
    btn.textContent="B"+b;
    if(st.bank===b) btn.className="blue";
    btn.onclick=function(){ st.bank=b; sendPC((st.bank-1)*4+SLOTS.indexOf(st.slot)); save(); draw(true); };
    bg.appendChild(btn);
  });

  var sg=document.getElementById("slots"); sg.innerHTML="";
  SLOTS.forEach(function(s){
    var btn=document.createElement("button");
    btn.textContent=""+st.bank+s;
    if(st.slot===s) btn.className="blue";
    btn.onclick=function(){ st.slot=s; sendPC((st.bank-1)*4+SLOTS.indexOf(st.slot)); save(); draw(true); };
    sg.appendChild(btn);
  });

  var cg=document.getElementById("chain"); cg.innerHTML="";
  p.chain.forEach(function(bid){
    var item=p.b[bid];
    if(!item||!META[bid]) return;
    var btn=document.createElement("button");
    btn.type="button";
    btn.className="chain-blk"+(item.on?" on":"")+(st.sel===bid?" sel":"");
    btn.innerHTML=
      "<span class='led-strip'></span>"+
      "<span class='blk-screen'><span class='blk-code'>"+bid+"</span><span class='blk-model'>"+item.model+"</span></span>";
    btn.onclick=function(){
      if(st.sel===bid){ item.on=!item.on; sendCC(META[bid].cc,item.on?100:0); }
      else st.sel=bid;
      save(); draw(false);
    };
    cg.appendChild(btn);
  });

  var pb=document.getElementById("pwrBtn");
  pb.textContent=blk.on?"ACTIVE":"BYPASS";
  pb.className=blk.on?"blue":"";
  pb.onclick=function(){ blk.on=!blk.on; sendCC(m.cc,blk.on?100:0); save(); draw(false); };

  var vg=document.getElementById("visualGear"); vg.innerHTML="";
  var allNames=flatModels(id);
  (GEAR[id]||[]).forEach(function(grp){
    var lbl=document.createElement("div"); lbl.className="grp-label"; lbl.textContent=grp.g; vg.appendChild(lbl);
    var grid=document.createElement("div"); grid.className="gear-grid";
    grp.items.forEach(function(it){
      var card=document.createElement("button"); card.type="button";
      card.className="gear-card"+(blk.model===it.n?" active":"");
      var artHtml="";
      if(id==="AMP"){
        artHtml=it.kind==="stack"?SVG_AMPS.stack:SVG_AMPS.combo;
      }else if(id==="IR"){
        artHtml=it.kind==="user"?SVG_CABS.user:SVG_CABS.cab;
      }else{
        artHtml=getPedalSVG(it.n,it.c||"#37474f",it.tag||"FX");
      }
      card.innerHTML="<div class='gear-art'>"+artHtml+"</div><div class='gear-name'>"+it.n+"</div>";
      card.onclick=function(){
        blk.model=it.n;
        var idx=allNames.indexOf(blk.model);
        var ccVal=allNames.length>1?Math.round((idx/(allNames.length-1))*127):0;
        sendCC(m.cc+40,ccVal); save(); draw(false);
      };
      grid.appendChild(card);
    });
    vg.appendChild(grid);
  });

  var irBox=document.getElementById("irExtras"); irBox.innerHTML="";
  if(id==="IR"){
    var micPanel=document.createElement("div"); micPanel.className="mic-panel";
    var headRow=document.createElement("div"); headRow.className="row";
    headRow.innerHTML="<span style='font-size:11px;font-weight:800;color:#7fb3ff;'>CAB MIC CONTROL (4 MICS &amp; 3 POSITIONS)</span>";
    var micToggle=document.createElement("button"); micToggle.type="button";
    micToggle.textContent=blk.micOn?"MIC ON":"MIC OFF"; micToggle.className=blk.micOn?"blue":"";
    micToggle.onclick=function(){ blk.micOn=!blk.micOn; sendCC(55,blk.micOn?100:0); save(); draw(false); };
    headRow.appendChild(micToggle); micPanel.appendChild(headRow);

    var micGrid=document.createElement("div"); micGrid.className="grid4";
    IR_MICS.forEach(function(micName,idx){
      var b=document.createElement("button"); b.type="button";
      b.className="mic-card"+(blk.mic===micName?" active":"");
      b.innerHTML="<div class='mic-art'>"+SVG_MICS[micName]+"</div><div class='gear-name'>"+micName+"</div>";
      b.onclick=function(){
        blk.mic=micName;
        blk.micOn=true;
        sendCC(53,Math.round((idx/3)*127));
        save(); draw(false);
      };
      micGrid.appendChild(b);
    });
    micPanel.appendChild(micGrid);

    var posLbl=document.createElement("div"); posLbl.className="grp-label"; posLbl.textContent="3 Mic Positions"; micPanel.appendChild(posLbl);
    var posGrid=document.createElement("div"); posGrid.className="grid3";
    IR_POS.forEach(function(posName,idx){
      var b=document.createElement("button"); b.type="button";
      var isSel=blk.pos===posName;
      b.className="pos-btn"+(isSel?" blue":"");
      var dotLeft=posName==="Edge"?"3px":(posName==="Middle"?"15px":"27px");
      b.innerHTML=
        `<svg class='pos-art' viewBox='0 0 38 18'>`+
          `<rect x='1' y='1' width='36' height='16' rx='8' fill='#0e1217' stroke='#455a64' stroke-width='1'/>`+
          `<circle cx='${dotLeft}' cy='9' r='4' fill='${isSel?"#fff":"#ffb300"}'/>`+
        `</svg>`+
        `<span class='gear-name'>${posName}</span>`;
      b.onclick=function(){
        blk.pos=posName;
        blk.micOn=true;
        sendCC(54,Math.round((idx/2)*127));
        save(); draw(false);
      };
      posGrid.appendChild(b);
    });
    micPanel.appendChild(posGrid);

    var lvlBox=document.createElement("div"); lvlBox.style.marginTop="10px";
    lvlBox.innerHTML="<div class='row'><span style='font-size:12px;font-weight:700;'>Mic Level</span><div class='row' style='gap:4px;'><button type='button' class='mminus'>-</button><span class='mval' style='min-width:34px;text-align:center;'>"+blk.micLvl+"</span><button type='button' class='mplus'>+</button></div></div><input type='range' min='0' max='100' value='"+blk.micLvl+"' style='width:100%;margin-top:6px;accent-color:#2196f3;'>";
    var mvEl=lvlBox.querySelector(".mval"), mrEl=lvlBox.querySelector("input[type=range]");
    function setMicLvl(nv){
      nv=Math.max(0,Math.min(100,Number(nv)));
      blk.micLvl=nv; mvEl.textContent=nv; mrEl.value=nv; sendCC(56,nv); save();
    }
    mrEl.oninput=function(){ setMicLvl(mrEl.value); };
    lvlBox.querySelector(".mminus").onclick=function(){ setMicLvl(blk.micLvl-1); };
    lvlBox.querySelector(".mplus").onclick=function(){ setMicLvl(blk.micLvl+1); };
    micPanel.appendChild(lvlBox);
    irBox.appendChild(micPanel);
  }

  var pw=document.getElementById("params"); pw.innerHTML="";
  m.p.forEach(function(pr){
    var cc=pr[1], val=(typeof blk.p[cc]==="number")?blk.p[cc]:pr[2]; blk.p[cc]=val;
    var box=document.createElement("div"); box.className="card"; box.style.padding="8px 10px"; box.style.marginTop="6px";
    box.innerHTML="<div class='row'><span style='font-size:13px;font-weight:700;'>"+pr[0]+"</span><div class='row' style='gap:4px;'><button type='button' class='minus'>-</button><span class='val' style='min-width:34px;text-align:center;'>"+val+"</span><button type='button' class='plus'>+</button></div></div><input type='range' min='0' max='100' value='"+val+"' style='width:100%;margin-top:6px;accent-color:#2196f3;'>";
    var vEl=box.querySelector(".val"), rEl=box.querySelector("input[type=range]");
    function setV(nv){
      nv=Math.max(0,Math.min(100,Number(nv)));
      blk.p[cc]=nv; vEl.textContent=nv; rEl.value=nv; sendCC(cc,nv); save();
    }
    rEl.oninput=function(){ setV(rEl.value); };
    box.querySelector(".minus").onclick=function(){ setV(blk.p[cc]-1); };
    box.querySelector(".plus").onclick=function(){ setV(blk.p[cc]+1); };
    pw.appendChild(box);
  });
}

function stepPatch(d){
  var list=[]; BANKS.forEach(function(b){ SLOTS.forEach(function(s){ list.push(""+b+s); }); });
  var i=list.indexOf(code()), nxt=list[(i+d+list.length)%list.length];
  st.bank=parseInt(nxt,10); st.slot=nxt.slice(-1);
  sendPC((st.bank-1)*4+SLOTS.indexOf(st.slot)); save(); draw(true);
}
function moveBlock(d){
  var p=patch(), i=p.chain.indexOf(st.sel), t=i+d;
  if(i<0||t<0||t>=p.chain.length) return;
  var tmp=p.chain[i]; p.chain[i]=p.chain[t]; p.chain[t]=tmp;
  sendChain(p); save(); draw(false);
}

document.getElementById("midiBtn").onclick=connectMidi;
document.getElementById("prevP").onclick=function(){ stepPatch(-1); };
document.getElementById("nextP").onclick=function(){ stepPatch(1); };
document.getElementById("setName").onclick=function(){
  var v=document.getElementById("nameInp").value.trim(); if(!v) return;
  var clean=v.slice(0,16); patch().name=clean; sendName(clean); save(); draw(true);
};
document.getElementById("mLeft").onclick=function(){ moveBlock(-1); };
document.getElementById("mRight").onclick=function(){ moveBlock(1); };
draw(true);
</script>
